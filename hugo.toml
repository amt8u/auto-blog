baseURL = "https://cloudmato.com/"
title   = "cloudmato.com"
theme   = "hugo-theme-monochrome"

defaultContentLanguage        = "en"
defaultContentLanguageInSubdir = false

enableEmoji     = true
enableRobotsTXT = true
paginate        = 10

[languages]
  [languages.en]
    label  = "English"
    weight = 1
  [languages.hi]
    label  = "हिंदी"
    title  = "cloudmato.com"
    weight = 2

[permalinks]
  posts = "/posts/:slug/"

[params]
  navbar_title          = "cloudmato.com"
  hide_navbar_on_scroll = false
  footer                = "© cloudmato.com — research-driven writing."
  color_scheme          = "light"
  navbar_width          = "wide"
  navbar_show_all_languages = true

  [params.author]
    name = "cloudmato.com"

  # Features
  enable_zooming_js    = true
  enable_header_anchor = true
  enable_toc           = true
  enable_site_search   = true
  enable_math          = false
  enable_open_graph    = true
  enable_twitter_cards = true

  # List layout
  enable_group_by_year = true
  enable_show_date     = true
  enable_pagination    = false

  # Syntax highlight
  syntax_highlight_lib              = "prism"
  enable_prism_copy_to_clipboard    = true
  enable_prism_show_line_number     = false

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.parser.attribute]
    block = true
    title = true
  [markup.highlight]
    codeFences = true
    noClasses  = true
    style      = "rrt"
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 3
    ordered    = false

[taxonomies]
  tag      = "tags"
  category = "categories"
  series   = "series"

[sitemap]
  changefreq = "weekly"
  priority   = 0.5
  filename   = "sitemap.xml"
