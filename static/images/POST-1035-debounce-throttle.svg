<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="eventGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="debounceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="throttleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rateLimitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Black Background -->
  <rect width="800" height="450" fill="url(#darkBg)"/>

  <!-- ============ DEBOUNCE SECTION ============ -->
  <g>
    <!-- Section background -->
    <rect x="30" y="20" width="230" height="120" rx="8" fill="rgba(30,30,30,0.6)" stroke="#1d4ed8" stroke-width="1.5" opacity="0.6"/>

    <!-- Title -->
    <text x="145" y="42" text-anchor="middle" fill="#3b82f6" font-size="15" font-weight="bold" font-family="Space Grotesk, sans-serif">
      DEBOUNCE
    </text>

    <!-- Timeline -->
    <line x1="50" y1="70" x2="220" y2="70" stroke="#444" stroke-width="2"/>

    <!-- Input Events (red) -->
    <circle cx="65" cy="70" r="4" fill="url(#eventGrad)" filter="url(#glow)"/>
    <circle cx="85" cy="70" r="4" fill="url(#eventGrad)" filter="url(#glow)"/>
    <circle cx="105" cy="70" r="4" fill="url(#eventGrad)" filter="url(#glow)"/>
    <circle cx="125" cy="70" r="4" fill="url(#eventGrad)" filter="url(#glow)"/>

    <!-- Output Event (blue) -->
    <circle cx="190" cy="70" r="6" fill="url(#debounceGrad)" filter="url(#glow)"/>

    <!-- Description -->
    <text x="145" y="100" text-anchor="middle" fill="#d1d5db" font-size="11" font-family="Nunito, sans-serif">
      Wait until quiet
    </text>
    <text x="145" y="115" text-anchor="middle" fill="#9ca3af" font-size="10" font-family="Nunito, sans-serif">
      Search, validation
    </text>
  </g>

  <!-- ============ THROTTLE SECTION ============ -->
  <g>
    <!-- Section background -->
    <rect x="285" y="20" width="230" height="120" rx="8" fill="rgba(30,30,30,0.6)" stroke="#059669" stroke-width="1.5" opacity="0.6"/>

    <!-- Title -->
    <text x="400" y="42" text-anchor="middle" fill="#10b981" font-size="15" font-weight="bold" font-family="Space Grotesk, sans-serif">
      THROTTLE
    </text>

    <!-- Timeline -->
    <line x1="305" y1="70" x2="475" y2="70" stroke="#444" stroke-width="2"/>

    <!-- Input Events (red) -->
    <circle cx="315" cy="70" r="4" fill="url(#eventGrad)" filter="url(#glow)"/>
    <circle cx="330" cy="70" r="4" fill="url(#eventGrad)" filter="url(#glow)"/>
    <circle cx="345" cy="70" r="4" fill="url(#eventGrad)" filter="url(#glow)"/>
    <circle cx="360" cy="70" r="4" fill="url(#eventGrad)" filter="url(#glow)"/>
    <circle cx="375" cy="70" r="4" fill="url(#eventGrad)" filter="url(#glow)"/>
    <circle cx="390" cy="70" r="4" fill="url(#eventGrad)" filter="url(#glow)"/>

    <!-- Output Events (green) -->
    <circle cx="325" cy="70" r="6" fill="url(#throttleGrad)" filter="url(#glow)"/>
    <circle cx="360" cy="70" r="6" fill="url(#throttleGrad)" filter="url(#glow)"/>
    <circle cx="395" cy="70" r="6" fill="url(#throttleGrad)" filter="url(#glow)"/>

    <!-- Description -->
    <text x="400" y="100" text-anchor="middle" fill="#d1d5db" font-size="11" font-family="Nunito, sans-serif">
      Fixed intervals
    </text>
    <text x="400" y="115" text-anchor="middle" fill="#9ca3af" font-size="10" font-family="Nunito, sans-serif">
      Scroll, animations
    </text>
  </g>

  <!-- ============ RATE LIMITING SECTION ============ -->
  <g>
    <!-- Section background -->
    <rect x="540" y="20" width="230" height="120" rx="8" fill="rgba(30,30,30,0.6)" stroke="#d97706" stroke-width="1.5" opacity="0.6"/>

    <!-- Title -->
    <text x="655" y="42" text-anchor="middle" fill="#f59e0b" font-size="15" font-weight="bold" font-family="Space Grotesk, sans-serif">
      RATE LIMIT
    </text>

    <!-- Timeline -->
    <line x1="560" y1="70" x2="730" y2="70" stroke="#444" stroke-width="2"/>

    <!-- Input Events (red) -->
    <circle cx="570" cy="70" r="4" fill="url(#eventGrad)" filter="url(#glow)"/>
    <circle cx="585" cy="70" r="4" fill="url(#eventGrad)" filter="url(#glow)"/>
    <circle cx="600" cy="70" r="4" fill="url(#eventGrad)" filter="url(#glow)"/>
    <circle cx="615" cy="70" r="4" fill="url(#eventGrad)" filter="url(#glow)"/>
    <circle cx="630" cy="70" r="4" fill="url(#eventGrad)" filter="url(#glow)"/>

    <!-- Output Events (orange) -->
    <circle cx="575" cy="70" r="6" fill="url(#rateLimitGrad)" filter="url(#glow)"/>
    <circle cx="610" cy="70" r="6" fill="url(#rateLimitGrad)" filter="url(#glow)"/>

    <!-- Description -->
    <text x="655" y="100" text-anchor="middle" fill="#d1d5db" font-size="11" font-family="Nunito, sans-serif">
      Quota-based
    </text>
    <text x="655" y="115" text-anchor="middle" fill="#9ca3af" font-size="10" font-family="Nunito, sans-serif">
      APIs, requests
    </text>
  </g>

  <!-- ============ COMPARISON TABLE ============ -->
  <g>
    <!-- Title -->
    <text x="400" y="180" text-anchor="middle" fill="#d1d5db" font-size="14" font-weight="bold" font-family="Space Grotesk, sans-serif">
      When to Use
    </text>

    <!-- Table background -->
    <rect x="40" y="200" width="720" height="200" rx="8" fill="rgba(20,20,20,0.8)" stroke="#444" stroke-width="1"/>

    <!-- Column headers -->
    <text x="150" y="225" text-anchor="middle" fill="#3b82f6" font-size="11" font-weight="bold" font-family="IBM Plex Mono, monospace">
      DEBOUNCE
    </text>
    <text x="400" y="225" text-anchor="middle" fill="#10b981" font-size="11" font-weight="bold" font-family="IBM Plex Mono, monospace">
      THROTTLE
    </text>
    <text x="650" y="225" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="bold" font-family="IBM Plex Mono, monospace">
      RATE LIMIT
    </text>

    <!-- Separator line -->
    <line x1="50" y1="235" x2="750" y2="235" stroke="#333" stroke-width="1"/>

    <!-- Row 1: Search -->
    <circle cx="150" cy="260" r="4" fill="#3b82f6" opacity="0.8"/>
    <text x="170" y="265" fill="#9ca3af" font-size="10" font-family="Nunito, sans-serif">
      Search input
    </text>

    <!-- Row 2: Scroll -->
    <circle cx="400" cy="260" r="4" fill="#10b981" opacity="0.8"/>
    <text x="420" y="265" fill="#9ca3af" font-size="10" font-family="Nunito, sans-serif">
      Scroll events
    </text>

    <!-- Row 3: Form validation -->
    <circle cx="150" cy="290" r="4" fill="#3b82f6" opacity="0.8"/>
    <text x="170" y="295" fill="#9ca3af" font-size="10" font-family="Nunito, sans-serif">
      Form validation
    </text>

    <!-- Row 4: API requests -->
    <circle cx="150" cy="320" r="4" fill="#3b82f6" opacity="0.8"/>
    <circle cx="400" cy="320" r="4" fill="#f59e0b" opacity="0.8"/>
    <text x="170" y="325" fill="#9ca3af" font-size="10" font-family="Nunito, sans-serif">
      API requests
    </text>
    <text x="420" y="325" fill="#9ca3af" font-size="10" font-family="Nunito, sans-serif">
      + Rate Limit
    </text>

    <!-- Row 5: Mouse movement -->
    <circle cx="400" cy="350" r="4" fill="#10b981" opacity="0.8"/>
    <text x="420" y="355" fill="#9ca3af" font-size="10" font-family="Nunito, sans-serif">
      Mouse movement
    </text>

    <!-- Row 6: File uploads -->
    <circle cx="650" cy="350" r="4" fill="#f59e0b" opacity="0.8"/>
    <text x="670" y="355" fill="#9ca3af" font-size="10" font-family="Nunito, sans-serif">
      File uploads
    </text>
  </g>

  <!-- ============ BOTTOM TITLE ============ -->
  <g>
    <!-- Background -->
    <rect x="0" y="410" width="800" height="40" fill="rgba(0,0,0,0.6)"/>

    <!-- Title -->
    <text x="400" y="435" text-anchor="middle" fill="white" font-size="18" font-weight="bold" font-family="Space Grotesk, sans-serif">
      Performance Optimization Techniques
    </text>
  </g>
</svg>