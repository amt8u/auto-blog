<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="'Space Grotesk','Nunito',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf6ef"/>
      <stop offset="1" stop-color="#f1e7db"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33477a"/>
      <stop offset="1" stop-color="#212f57"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#3a2c1a" flood-opacity="0.15"/>
    </filter>
    <g id="bolt">
      <path d="M6 -18 L-9 6 L-1 6 L-7 20 L11 -4 L2 -4 L9 -18 Z"
            fill="#ffd23f" stroke="#c58a12" stroke-width="1.4" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <g stroke="#e3d5c2" stroke-width="1" opacity="0.6">
    <path d="M0 90 H1200 M0 180 H1200 M0 270 H1200 M0 360 H1200 M0 450 H1200 M0 540 H1200"/>
    <path d="M100 0 V630 M300 0 V630 M500 0 V630 M700 0 V630 M900 0 V630 M1100 0 V630"/>
  </g>
  <ellipse cx="600" cy="315" rx="560" ry="330" fill="url(#glow)"/>

  <!-- concentric cache layers wrapping the origin -->
  <g filter="url(#soft)">
    <rect x="180" y="65"  width="800" height="500" rx="40" fill="#f7b24a"/>
    <rect x="260" y="120" width="640" height="390" rx="34" fill="#f0885a"/>
    <rect x="340" y="175" width="480" height="280" rx="28" fill="#3fae9f"/>
    <rect x="420" y="230" width="320" height="170" rx="22" fill="#5b78e8"/>
  </g>

  <!-- layer labels along the top band of each ring -->
  <g font-family="'IBM Plex Mono',monospace" font-weight="600" letter-spacing="2" text-anchor="middle">
    <text x="580" y="96"  font-size="20" fill="#7a4708">BROWSER</text>
    <text x="580" y="150" font-size="19" fill="#8a3618">CDN</text>
    <text x="580" y="204" font-size="18" fill="#0d5850">REVERSE PROXY</text>
    <text x="580" y="258" font-size="17" fill="#e9edff">IN-MEMORY</text>
  </g>

  <!-- origin database core -->
  <g transform="translate(580,320)">
    <ellipse cx="0" cy="42" rx="82" ry="18" fill="#1a274a"/>
    <path d="M-82 -30 v72 a82 18 0 0 0 164 0 v-72 z" fill="url(#core)"/>
    <ellipse cx="0" cy="-30" rx="82" ry="18" fill="#43578c"/>
    <ellipse cx="0" cy="-8"  rx="82" ry="18" fill="none" stroke="#2a3a66" stroke-width="2" opacity="0.7"/>
    <ellipse cx="0" cy="14"  rx="82" ry="18" fill="none" stroke="#2a3a66" stroke-width="2" opacity="0.7"/>
    <text x="0" y="-24" text-anchor="middle" font-family="'IBM Plex Mono',monospace"
          font-size="16" font-weight="700" letter-spacing="1.5" fill="#cdd8f5">ORIGIN</text>
    <text x="0" y="52" text-anchor="middle" font-family="'IBM Plex Mono',monospace"
          font-size="12" letter-spacing="2" fill="#9fb0dd">DATABASE</text>
  </g>

  <!-- requester on the left -->
  <g transform="translate(92,300)">
    <circle cx="0" cy="-20" r="18" fill="#3fae9f"/>
    <path d="M-30 32 a30 30 0 0 1 60 0 z" fill="#3fae9f"/>
  </g>

  <!-- request travels inward -->
  <g fill="none" stroke="#7a4708" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" opacity="0.8">
    <path d="M118 296 H470"/>
  </g>
  <path d="M470 296 l-14 -7 v14 z" fill="#7a4708"/>

  <!-- fast cache hit returning early from an outer layer -->
  <g fill="none" stroke="#c58a12" stroke-width="3.5" stroke-linecap="round">
    <path d="M320 250 C 240 210, 170 250, 128 288"/>
  </g>
  <path d="M128 288 l16 -3 l-9 -11 z" fill="#c58a12"/>

  <use href="#bolt" x="345" y="238" transform="scale(1.15)" transform-origin="345 238"/>
  <use href="#bolt" x="905" y="130" transform="scale(0.8)"/>
  <use href="#bolt" x="880" y="470" transform="scale(0.8)"/>

  <g transform="translate(258,250)">
    <rect x="-30" y="-15" width="60" height="26" rx="13" fill="#ffffff" stroke="#c58a12" stroke-width="1.5"/>
    <text x="0" y="3" text-anchor="middle" font-family="'IBM Plex Mono',monospace"
          font-size="13" font-weight="700" letter-spacing="1" fill="#a5600c">HIT</text>
  </g>

  <!-- POST badge -->
  <g transform="translate(600,595)">
    <rect x="-58" y="-19" width="116" height="34" rx="17" fill="#212f57"/>
    <text x="0" y="4" text-anchor="middle" font-family="'IBM Plex Mono',monospace"
          font-size="16" font-weight="700" letter-spacing="2" fill="#ffd23f">POST-1070</text>
  </g>

  <!-- watermark -->
  <text x="1176" y="42" text-anchor="end" font-family="'IBM Plex Mono',monospace"
        font-size="16" letter-spacing="1" fill="#9a8straps" fill-opacity="1" style="fill:#a08a6c">cloudmato.com</text>
</svg>