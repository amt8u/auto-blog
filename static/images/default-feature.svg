<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- Subtle glow behind logo -->
  <circle cx="600" cy="210" r="220" fill="url(#glow)"/>

  <!-- Subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="84" x2="1200" y2="84"/>
    <line x1="0" y1="168" x2="1200" y2="168"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="336" x2="1200" y2="336"/>
    <line x1="150" y1="0" x2="150" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="450" y1="0" x2="450" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1050" y1="0" x2="1050" y2="420"/>
  </g>

  <!-- Logo icon — centered horizontally, upper portion -->
  <!-- Icon box: 120x120, centered at x=600 → x=540 -->
  <rect x="540" y="90" width="120" height="120" rx="28" fill="#2563eb"/>

  <!-- White cloud shape -->
  <circle cx="565"  cy="176" r="22" fill="white"/>
  <circle cx="594"  cy="158" r="28" fill="white"/>
  <circle cx="623"  cy="168" r="24" fill="white"/>
  <rect   x="543"  y="176"  width="114" height="30" rx="4" fill="white"/>

  <!-- Checkmark on cloud -->
  <polyline points="572,165 585,178 608,150"
            fill="none" stroke="#2563eb" stroke-width="7"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark: cloudmato -->
  <text x="600" y="268"
        font-family="'Space Grotesk', system-ui, -apple-system, sans-serif"
        font-size="52" font-weight="700"
        fill="white" text-anchor="middle"
        letter-spacing="-1">cloudmato</text>

  <!-- Tagline -->
  <text x="600" y="308"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="16" font-weight="400"
        fill="#64748b" text-anchor="middle"
        letter-spacing="3">RESEARCH · AUTOMATION · TECHNOLOGY</text>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="3" fill="#2563eb" opacity="0.8"/>
</svg>
