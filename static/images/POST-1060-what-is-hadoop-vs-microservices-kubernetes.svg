<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="'Space Grotesk', 'Nunito', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf6"/>
      <stop offset="1" stop-color="#eef3f9"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef4e4"/>
      <stop offset="1" stop-color="#fde7c5"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf2fe"/>
      <stop offset="1" stop-color="#d9e8fc"/>
    </linearGradient>
    <linearGradient id="diskA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7b94f"/>
      <stop offset="1" stop-color="#e89422"/>
    </linearGradient>
    <linearGradient id="diskB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fa0f6"/>
      <stop offset="1" stop-color="#2f6fd6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1c2b45" flood-opacity="0.12"/>
    </filter>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d9831a"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f6fd6"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- kicker -->
  <text x="600" y="78" text-anchor="middle" font-size="20" letter-spacing="7" font-weight="600" fill="#9aa6b8">DISTRIBUTED SYSTEMS · TWO MENTAL MODELS</text>

  <!-- ===================== LEFT: HADOOP (move CODE to DATA) ===================== -->
  <g>
    <text x="300" y="135" text-anchor="middle" font-size="34" font-weight="700" fill="#9a560c" letter-spacing="3">HADOOP</text>
    <text x="300" y="163" text-anchor="middle" font-size="17" font-weight="600" fill="#c07b1f" font-family="'IBM Plex Mono', monospace">code → data</text>

    <!-- four self-contained nodes: compute lives ON the data -->
    <g>
      <!-- node template repeated -->
      <!-- node 1 -->
      <g transform="translate(80,195)">
        <rect width="190" height="130" rx="16" fill="url(#amber)" stroke="#e2a14a" stroke-width="2" filter="url(#soft)"/>
        <!-- disk cylinder -->
        <g transform="translate(34,38)">
          <path d="M0 8 a26 9 0 0 1 52 0 v40 a26 9 0 0 1 -52 0 z" fill="url(#diskA)"/>
          <ellipse cx="26" cy="8" rx="26" ry="9" fill="#fbd089"/>
          <ellipse cx="26" cy="28" rx="26" ry="9" fill="none" stroke="#c9791a" stroke-width="1.5" opacity="0.5"/>
        </g>
        <!-- locality link -->
        <line x1="98" y1="65" x2="118" y2="65" stroke="#d9831a" stroke-width="3" marker-end="url(#arrA)"/>
        <!-- compute chip sitting next to its own data -->
        <g transform="translate(120,42)">
          <rect width="46" height="46" rx="8" fill="#fff7ea" stroke="#d9831a" stroke-width="2"/>
          <rect x="11" y="11" width="24" height="24" rx="3" fill="#f4a72c"/>
          <line x1="23" y1="0" x2="23" y2="-7" stroke="#d9831a" stroke-width="2"/>
          <line x1="23" y1="46" x2="23" y2="53" stroke="#d9831a" stroke-width="2"/>
        </g>
      </g>
      <!-- node 2 -->
      <g transform="translate(290,195)">
        <rect width="190" height="130" rx="16" fill="url(#amber)" stroke="#e2a14a" stroke-width="2" filter="url(#soft)"/>
        <g transform="translate(34,38)">
          <path d="M0 8 a26 9 0 0 1 52 0 v40 a26 9 0 0 1 -52 0 z" fill="url(#diskA)"/>
          <ellipse cx="26" cy="8" rx="26" ry="9" fill="#fbd089"/>
          <ellipse cx="26" cy="28" rx="26" ry="9" fill="none" stroke="#c9791a" stroke-width="1.5" opacity="0.5"/>
        </g>
        <line x1="98" y1="65" x2="118" y2="65" stroke="#d9831a" stroke-width="3" marker-end="url(#arrA)"/>
        <g transform="translate(120,42)">
          <rect width="46" height="46" rx="8" fill="#fff7ea" stroke="#d9831a" stroke-width="2"/>
          <rect x="11" y="11" width="24" height="24" rx="3" fill="#f4a72c"/>
          <line x1="23" y1="0" x2="23" y2="-7" stroke="#d9831a" stroke-width="2"/>
          <line x1="23" y1="46" x2="23" y2="53" stroke="#d9831a" stroke-width="2"/>
        </g>
      </g>
      <!-- node 3 -->
      <g transform="translate(80,345)">
        <rect width="190" height="130" rx="16" fill="url(#amber)" stroke="#e2a14a" stroke-width="2" filter="url(#soft)"/>
        <g transform="translate(34,38)">
          <path d="M0 8 a26 9 0 0 1 52 0 v40 a26 9 0 0 1 -52 0 z" fill="url(#diskA)"/>
          <ellipse cx="26" cy="8" rx="26" ry="9" fill="#fbd089"/>
          <ellipse cx="26" cy="28" rx="26" ry="9" fill="none" stroke="#c9791a" stroke-width="1.5" opacity="0.5"/>
        </g>
        <line x1="98" y1="65" x2="118" y2="65" stroke="#d9831a" stroke-width="3" marker-end="url(#arrA)"/>
        <g transform="translate(120,42)">
          <rect width="46" height="46" rx="8" fill="#fff7ea" stroke="#d9831a" stroke-width="2"/>
          <rect x="11" y="11" width="24" height="24" rx="3" fill="#f4a72c"/>
          <line x1="23" y1="0" x2="23" y2="-7" stroke="#d9831a" stroke-width="2"/>
          <line x1="23" y1="46" x2="23" y2="53" stroke="#d9831a" stroke-width="2"/>
        </g>
      </g>
      <!-- node 4 -->
      <g transform="translate(290,345)">
        <rect width="190" height="130" rx="16" fill="url(#amber)" stroke="#e2a14a" stroke-width="2" filter="url(#soft)"/>
        <g transform="translate(34,38)">
          <path d="M0 8 a26 9 0 0 1 52 0 v40 a26 9 0 0 1 -52 0 z" fill="url(#diskA)"/>
          <ellipse cx="26" cy="8" rx="26" ry="9" fill="#fbd089"/>
          <ellipse cx="26" cy="28" rx="26" ry="9" fill="none" stroke="#c9791a" stroke-width="1.5" opacity="0.5"/>
        </g>
        <line x1="98" y1="65" x2="118" y2="65" stroke="#d9831a" stroke-width="3" marker-end="url(#arrA)"/>
        <g transform="translate(120,42)">
          <rect width="46" height="46" rx="8" fill="#fff7ea" stroke="#d9831a" stroke-width="2"/>
          <rect x="11" y="11" width="24" height="24" rx="3" fill="#f4a72c"/>
          <line x1="23" y1="0" x2="23" y2="-7" stroke="#d9831a" stroke-width="2"/>
          <line x1="23" y1="46" x2="23" y2="53" stroke="#d9831a" stroke-width="2"/>
        </g>
      </g>
    </g>
    <text x="300" y="510" text-anchor="middle" font-size="15" fill="#a9772f" font-weight="600">compute lives on the data</text>
  </g>

  <!-- ===================== DIVIDER + ≠ ===================== -->
  <g>
    <line x1="600" y1="150" x2="600" y2="500" stroke="#c4cdda" stroke-width="2" stroke-dasharray="3 8"/>
    <circle cx="600" cy="315" r="42" fill="#ffffff" stroke="#7c8aa0" stroke-width="2.5" filter="url(#soft)"/>
    <text x="600" y="333" text-anchor="middle" font-size="46" font-weight="700" fill="#46546b">≠</text>
  </g>

  <!-- ===================== RIGHT: K8s (move DATA to CODE) ===================== -->
  <g>
    <text x="900" y="135" text-anchor="middle" font-size="34" font-weight="700" fill="#1d4ba3" letter-spacing="3">KUBERNETES</text>
    <text x="900" y="163" text-anchor="middle" font-size="17" font-weight="600" fill="#3b7ad1" font-family="'IBM Plex Mono', monospace">data → code</text>

    <!-- stateless pods (hexagons) -->
    <g stroke="#2f6fd6" stroke-width="2" stroke-linejoin="round">
      <g transform="translate(740,225)">
        <polygon points="0,-44 38,-22 38,22 0,44 -38,22 -38,-22" fill="#ffffff" filter="url(#soft)"/>
        <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="#9cc1f5" stroke="none"/>
      </g>
      <g transform="translate(900,225)">
        <polygon points="0,-44 38,-22 38,22 0,44 -38,22 -38,-22" fill="#ffffff" filter="url(#soft)"/>
        <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="#9cc1f5" stroke="none"/>
      </g>
      <g transform="translate(1060,225)">
        <polygon points="0,-44 38,-22 38,22 0,44 -38,22 -38,-22" fill="#ffffff" filter="url(#soft)"/>
        <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="#9cc1f5" stroke="none"/>
      </g>
    </g>
    <text x="900" y="305" text-anchor="middle" font-size="13" letter-spacing="2" font-weight="600" fill="#5d80b0" font-family="'IBM Plex Mono', monospace">STATELESS PODS</text>

    <!-- data flowing UP from shared storage to pods -->
    <g stroke="#2f6fd6" stroke-width="3" fill="none">
      <path d="M900 392 C 820 380, 760 330, 740 280" marker-end="url(#arrB)"/>
      <path d="M900 392 L 900 280" marker-end="url(#arrB)"/>
      <path d="M900 392 C 980 380, 1040 330, 1060 280" marker-end="url(#arrB)"/>
    </g>

    <!-- central shared storage -->
    <g transform="translate(780,392)" filter="url(#soft)">
      <path d="M0 14 a120 22 0 0 1 240 0 v62 a120 22 0 0 1 -240 0 z" fill="url(#diskB)"/>
      <ellipse cx="120" cy="14" rx="120" ry="22" fill="#7fb0f7"/>
      <ellipse cx="120" cy="44" rx="120" ry="22" fill="none" stroke="#1f5bbf" stroke-width="1.5" opacity="0.5"/>
      <ellipse cx="120" cy="64" rx="120" ry="22" fill="none" stroke="#1f5bbf" stroke-width="1.5" opacity="0.5"/>
    </g>
    <text x="900" y="510" text-anchor="middle" font-size="15" fill="#3b6bb0" font-weight="600">shared storage feeds the compute</text>
  </g>

  <!-- badge -->
  <g transform="translate(545,560)">
    <rect width="110" height="34" rx="9" fill="#1f2a3d"/>
    <text x="55" y="23" text-anchor="middle" font-size="15" fill="#e9eef6" font-family="'IBM Plex Mono', monospace" letter-spacing="1">POST-1060</text>
  </g>

  <!-- watermark -->
  <text x="1176" y="612" text-anchor="end" font-size="15" fill="#8b97a8" font-family="'IBM Plex Mono', monospace">cloudmato.com</text>
</svg>