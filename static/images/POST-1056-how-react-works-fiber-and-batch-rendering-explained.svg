<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="0.55" stop-color="#121b35"/>
      <stop offset="1" stop-color="#1c2c4f"/>
    </linearGradient>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#61DAFB" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#61DAFB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="outGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#61DAFB"/>
      <stop offset="1" stop-color="#b6f3ff"/>
    </linearGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#3a4f78" opacity="0.35"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowBig" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="winClip">
      <rect x="880" y="140" width="250" height="350" rx="14"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- decorative background hexagons -->
  <polygon points="100,40 35,-73 -95,-73 -160,40 -95,153 35,153" fill="none" stroke="#2a3b5c" stroke-opacity="0.25" stroke-width="1.5"/>
  <polygon points="1380,560 1305,430 1155,430 1080,560 1155,690 1305,690" fill="none" stroke="#2a3b5c" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- abstract atom mark, top right -->
  <g transform="translate(1085,92)" fill="none" stroke="#61DAFB" stroke-width="3" opacity="0.18">
    <ellipse rx="54" ry="21"/>
    <ellipse rx="54" ry="21" transform="rotate(60)"/>
    <ellipse rx="54" ry="21" transform="rotate(120)"/>
    <circle r="6" fill="#61DAFB" stroke="none"/>
  </g>

  <!-- eyebrow tag -->
  <text x="60" y="56" font-family="'Space Grotesk',sans-serif" font-size="16" font-weight="700" letter-spacing="5" fill="#8fa3c4">RECONCILER</text>
  <rect x="60" y="66" width="94" height="3" fill="#61DAFB" opacity="0.6"/>

  <!-- hub ambient glow -->
  <circle cx="620" cy="315" r="180" fill="url(#hubGlow)"/>

  <!-- incoming update strands -->
  <g fill="none" stroke-width="2.5" stroke-linecap="round">
    <path id="p1" d="M170,95 C320,95 380,255 495,315" stroke="#FF6B6B" opacity="0.55"/>
    <path id="p2" d="M170,205 C320,205 380,278 495,315" stroke="#FFD166" opacity="0.55"/>
    <path id="p3" d="M170,315 C320,315 380,315 495,315" stroke="#61DAFB" opacity="0.55"/>
    <path id="p4" d="M170,425 C320,425 380,352 495,315" stroke="#A78BFA" opacity="0.55"/>
    <path id="p5" d="M170,535 C320,535 380,375 495,315" stroke="#4ADE80" opacity="0.55"/>
  </g>

  <!-- traveling update pulses -->
  <g filter="url(#glow)">
    <circle r="3.5" fill="#FF6B6B"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath xlink:href="#p1"/></animateMotion></circle>
    <circle r="3.5" fill="#FFD166"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath xlink:href="#p2"/></animateMotion></circle>
    <circle r="3.5" fill="#61DAFB"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath xlink:href="#p3"/></animateMotion></circle>
    <circle r="3.5" fill="#A78BFA"><animateMotion dur="3s" repeatCount="indefinite"><mpath xlink:href="#p4"/></animateMotion></circle>
    <circle r="3.5" fill="#4ADE80"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath xlink:href="#p5"/></animateMotion></circle>
  </g>

  <!-- source nodes + labels -->
  <g font-family="'IBM Plex Mono',monospace" font-size="15" fill="#9fb3c8" text-anchor="end">
    <circle cx="170" cy="95" r="10" fill="#FF6B6B" filter="url(#glow)"/>
    <text x="148" y="100">click</text>
    <circle cx="170" cy="205" r="10" fill="#FFD166" filter="url(#glow)"/>
    <text x="148" y="210">input</text>
    <circle cx="170" cy="315" r="10" fill="#61DAFB" filter="url(#glow)"/>
    <text x="148" y="320">fetch</text>
    <circle cx="170" cy="425" r="10" fill="#A78BFA" filter="url(#glow)"/>
    <text x="148" y="430">timer</text>
    <circle cx="170" cy="535" r="10" fill="#4ADE80" filter="url(#glow)"/>
    <text x="148" y="540">effect</text>
  </g>

  <!-- Fiber hub -->
  <path d="M745,315 L682,207 L558,207 L495,315 L558,423 L682,423 Z" fill="#0e1a30" fill-opacity="0.75" stroke="#61DAFB" stroke-width="2" filter="url(#glowBig)"/>

  <!-- inner fiber tree -->
  <g stroke="#61DAFB" stroke-width="1.5" opacity="0.6">
    <line x1="620" y1="260" x2="585" y2="305"/>
    <line x1="620" y1="260" x2="655" y2="305"/>
    <line x1="585" y1="305" x2="562" y2="355"/>
    <line x1="585" y1="305" x2="608" y2="355"/>
    <line x1="655" y1="305" x2="632" y2="355"/>
    <line x1="655" y1="305" x2="678" y2="355"/>
  </g>
  <g>
    <circle cx="620" cy="260" r="9" fill="#eafcff" filter="url(#glow)"/>
    <circle cx="585" cy="305" r="7" fill="#bff0ff"/>
    <circle cx="655" cy="305" r="7" fill="#bff0ff"/>
    <circle cx="562" cy="355" r="6" fill="#61DAFB"/>
    <circle cx="608" cy="355" r="6" fill="#61DAFB"/>
    <circle cx="632" cy="355" r="6" fill="#61DAFB"/>
    <circle cx="678" cy="355" r="6" fill="#61DAFB"/>
  </g>

  <text x="620" y="455" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-size="22" font-weight="700" letter-spacing="5" fill="#61DAFB">FIBER</text>

  <!-- batched commit output -->
  <path id="pOut" d="M745,315 C800,315 830,315 880,315" fill="none" stroke="url(#outGrad)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <circle r="5" fill="#eafcff" filter="url(#glow)">
    <animateMotion dur="1.4s" repeatCount="indefinite"><mpath xlink:href="#pOut"/></animateMotion>
  </circle>

  <rect x="765" y="298" width="92" height="34" rx="17" fill="#0c1830" stroke="#61DAFB" stroke-width="1.5"/>
  <text x="811" y="320" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="14" font-weight="600" letter-spacing="2" fill="#61DAFB">BATCH</text>

  <!-- UI mockup -->
  <g clip-path="url(#winClip)">
    <rect x="880" y="140" width="250" height="350" fill="#0c1424"/>
    <rect x="880" y="140" width="250" height="36" fill="#101b30"/>
    <circle cx="900" cy="158" r="5" fill="#FF6B6B"/>
    <circle cx="916" cy="158" r="5" fill="#FFD166"/>
    <circle cx="932" cy="158" r="5" fill="#4ADE80"/>
    <rect x="900" y="195" width="95" height="70" rx="8" fill="#15233d" stroke="#61DAFB" stroke-opacity="0.65" stroke-width="1.5" filter="url(#glow)"/>
    <rect x="1015" y="195" width="95" height="70" rx="8" fill="#15233d" stroke="#61DAFB" stroke-opacity="0.65" stroke-width="1.5" filter="url(#glow)"/>
    <rect x="900" y="280" width="95" height="70" rx="8" fill="#15233d" stroke="#61DAFB" stroke-opacity="0.65" stroke-width="1.5" filter="url(#glow)"/>
    <rect x="1015" y="280" width="95" height="70" rx="8" fill="#15233d" stroke="#61DAFB" stroke-opacity="0.65" stroke-width="1.5" filter="url(#glow)"/>
    <rect x="900" y="365" width="210" height="40" rx="8" fill="#15233d" stroke="#61DAFB" stroke-opacity="0.65" stroke-width="1.5" filter="url(#glow)"/>
  </g>
  <rect x="880" y="140" width="250" height="350" rx="14" fill="none" stroke="#2a3b5c" stroke-width="1.5"/>

  <!-- automatic batching timeline -->
  <text x="460" y="520" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-size="16" font-weight="700" letter-spacing="5" fill="#8fa3c4">VERSIONS</text>
  <line x1="160" y1="580" x2="660" y2="580" stroke="#3a4f78" stroke-width="2" stroke-dasharray="3 5"/>
  <polygon points="660,580 648,574 648,586" fill="#61DAFB"/>

  <circle cx="290" cy="580" r="22" fill="#0e1a30" stroke="#61DAFB" stroke-width="2" stroke-opacity="0.6"/>
  <text x="290" y="586" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="15" fill="#9fb3c8">16</text>

  <circle cx="460" cy="580" r="22" fill="#0e1a30" stroke="#61DAFB" stroke-width="2" stroke-opacity="0.8"/>
  <text x="460" y="586" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="15" fill="#cdeefd">18</text>

  <circle cx="600" cy="580" r="25" fill="#0e1a30" stroke="#61DAFB" stroke-width="2.5" filter="url(#glow)"/>
  <text x="600" y="586" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="15" font-weight="700" fill="#eafcff">19.2</text>

  <!-- post badge -->
  <rect x="985" y="565" width="150" height="34" rx="17" fill="#0c1830" stroke="#61DAFB" stroke-width="1.5"/>
  <text x="1060" y="587" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="14" letter-spacing="1.5" fill="#61DAFB">POST-1056</text>

  <!-- watermark -->
  <text x="1180" y="615" text-anchor="end" font-family="'Space Grotesk',sans-serif" font-size="14" fill="#5b6b8c" opacity="0.7">cloudmato.com</text>
</svg>