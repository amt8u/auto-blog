<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340">
  <rect width="700" height="340" fill="#ffffff"/>
  <rect x="40" y="30" width="180" height="70" rx="8" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="130" y="60" text-anchor="middle" font-size="14" fill="#333333" font-weight="bold">Host App</text>
  <text x="130" y="80" text-anchor="middle" font-size="12" fill="#333333">(Vite)</text>

  <rect x="430" y="20" width="220" height="70" rx="8" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="540" y="50" text-anchor="middle" font-size="14" fill="#333333" font-weight="bold">Remote: checkout</text>
  <text x="540" y="70" text-anchor="middle" font-size="12" fill="#333333">remoteEntry.js</text>

  <rect x="430" y="110" width="220" height="70" rx="8" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="540" y="140" text-anchor="middle" font-size="14" fill="#333333" font-weight="bold">Remote: profile</text>
  <text x="540" y="160" text-anchor="middle" font-size="12" fill="#333333">remoteEntry.js</text>

  <line x1="220" y1="60" x2="430" y2="55" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="45" text-anchor="middle" font-size="11" fill="#4a90e2">import('checkout/Cart')</text>

  <line x1="220" y1="75" x2="430" y2="145" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="120" text-anchor="middle" font-size="11" fill="#4a90e2">import('profile/Avatar')</text>

  <rect x="180" y="240" width="340" height="70" rx="8" fill="#f0f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="350" y="270" text-anchor="middle" font-size="14" fill="#333333" font-weight="bold">Shared singleton: react, react-dom</text>
  <text x="350" y="290" text-anchor="middle" font-size="12" fill="#333333">resolved once, reused by host + remotes</text>

  <line x1="130" y1="100" x2="280" y2="240" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="540" y1="90" x2="450" y2="240" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="540" y1="180" x2="420" y2="240" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#4a90e2"/>
    </marker>
  </defs>
</svg>