<svg xmlns="http://www.w3.org/2000/svg" width="700" height="260" viewBox="0 0 700 260">
  <rect width="700" height="260" fill="#ffffff"/>

  <text x="20" y="30" font-size="13" fill="#333333" font-weight="bold">Remote app</text>
  <rect x="20" y="45" width="180" height="50" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="110" y="75" text-anchor="middle" font-size="12" fill="#333333">vite build --watch</text>

  <line x1="200" y1="70" x2="330" y2="70" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="330" y="45" width="200" height="50" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="430" y="68" text-anchor="middle" font-size="12" fill="#333333">remoteEntry.js</text>
  <text x="430" y="85" text-anchor="middle" font-size="11" fill="#333333">+ exposed chunks (static)</text>

  <text x="20" y="150" font-size="13" fill="#333333" font-weight="bold">Host app</text>
  <rect x="20" y="165" width="180" height="50" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="110" y="190" text-anchor="middle" font-size="12" fill="#333333">vite dev (full HMR)</text>

  <line x1="200" y1="190" x2="330" y2="190" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="430" y1="95" x2="430" y2="165" stroke="#4a90e2" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow2)"/>

  <rect x="330" y="165" width="200" height="50" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="430" y="188" text-anchor="middle" font-size="12" fill="#333333">import('remote/Button')</text>
  <text x="430" y="205" text-anchor="middle" font-size="11" fill="#333333">fetched at runtime</text>

  <text x="560" y="135" font-size="11" fill="#333333" font-style="italic">No HMR across</text>
  <text x="560" y="150" font-size="11" fill="#333333" font-style="italic">this boundary —</text>
  <text x="560" y="165" font-size="11" fill="#333333" font-style="italic">rebuild + refresh</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#4a90e2"/>
    </marker>
  </defs>
</svg>