<svg xmlns="http://www.w3.org/2000/svg" width="700" height="280" viewBox="0 0 700 280">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4a90e2"/>
    </marker>
  </defs>
  <rect width="700" height="280" fill="white"/>
  <!-- Driver -->
  <rect x="30" y="107" width="155" height="62" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="107" y="133" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333333" font-weight="bold">Driver</text>
  <text x="107" y="154" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555555">SparkContext</text>
  <!-- Arrow Driver to Cluster Manager -->
  <line x1="185" y1="138" x2="265" y2="138" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Cluster Manager -->
  <rect x="265" y="107" width="165" height="62" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="347" y="133" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333333" font-weight="bold">Cluster Manager</text>
  <text x="347" y="154" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555555">YARN / K8s / Standalone</text>
  <!-- Arrows CM to Executors -->
  <line x1="430" y1="122" x2="492" y2="57" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="138" x2="492" y2="138" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="154" x2="492" y2="218" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Executor 1 -->
  <rect x="492" y="28" width="178" height="58" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="581" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333333" font-weight="bold">Executor — Worker 1</text>
  <text x="581" y="73" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555555">tasks + in-memory cache</text>
  <!-- Executor 2 -->
  <rect x="492" y="109" width="178" height="58" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="581" y="133" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333333" font-weight="bold">Executor — Worker 2</text>
  <text x="581" y="154" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555555">tasks + in-memory cache</text>
  <!-- Executor 3 -->
  <rect x="492" y="190" width="178" height="58" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="581" y="214" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333333" font-weight="bold">Executor — Worker 3</text>
  <text x="581" y="235" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555555">tasks + in-memory cache</text>
</svg>