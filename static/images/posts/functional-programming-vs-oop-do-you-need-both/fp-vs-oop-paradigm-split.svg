<svg xmlns="http://www.w3.org/2000/svg" width="700" height="280" viewBox="0 0 700 280">
  <rect width="700" height="280" fill="white"/>
  <rect x="30" y="40" width="285" height="200" rx="8" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="172" y="72" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#333333">Object-Oriented (OOP)</text>
  <text x="55" y="105" font-family="monospace" font-size="12" fill="#333333">• Objects carry state</text>
  <text x="55" y="130" font-family="monospace" font-size="12" fill="#333333">• Inheritance &amp; encapsulation</text>
  <text x="55" y="155" font-family="monospace" font-size="12" fill="#333333">• Mutable data by default</text>
  <text x="55" y="180" font-family="monospace" font-size="12" fill="#333333">• Models real-world entities</text>
  <text x="55" y="205" font-family="monospace" font-size="12" fill="#333333">• Best for: structure, lifecycle</text>
  <rect x="385" y="40" width="285" height="200" rx="8" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="527" y="72" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#333333">Functional Programming (FP)</text>
  <text x="410" y="105" font-family="monospace" font-size="12" fill="#333333">• Pure functions, no side effects</text>
  <text x="410" y="130" font-family="monospace" font-size="12" fill="#333333">• Immutable data</text>
  <text x="410" y="155" font-family="monospace" font-size="12" fill="#333333">• No shared state</text>
  <text x="410" y="180" font-family="monospace" font-size="12" fill="#333333">• Function composition</text>
  <text x="410" y="205" font-family="monospace" font-size="12" fill="#333333">• Best for: transforms, concurrency</text>
  <line x1="315" y1="140" x2="385" y2="140" stroke="#4a90e2" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="350" y="133" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#4a90e2">+</text>
  <text x="350" y="158" text-anchor="middle" font-family="monospace" font-size="10" fill="#4a90e2">multi-paradigm</text>
  <text x="350" y="265" text-anchor="middle" font-family="monospace" font-size="11" fill="#666666">Most modern languages support both — use what fits the problem</text>
</svg>