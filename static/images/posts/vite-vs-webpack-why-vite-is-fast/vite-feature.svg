<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="vite-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#bd34fe"/>
      <stop offset="100%" style="stop-color:#41d1ff"/>
    </linearGradient>
    <linearGradient id="vite-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd00f"/>
      <stop offset="100%" style="stop-color:#ffea83"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative bars across the top — "modules" being served instantly -->
  <g opacity="0.18">
    <rect x="60"  y="50" width="80"  height="6" rx="3" fill="#3b82f6"/>
    <rect x="160" y="50" width="140" height="6" rx="3" fill="#3b82f6"/>
    <rect x="320" y="50" width="60"  height="6" rx="3" fill="#3b82f6"/>
    <rect x="400" y="50" width="180" height="6" rx="3" fill="#3b82f6"/>
    <rect x="600" y="50" width="100" height="6" rx="3" fill="#3b82f6"/>
    <rect x="720" y="50" width="160" height="6" rx="3" fill="#3b82f6"/>
    <rect x="900" y="50" width="80"  height="6" rx="3" fill="#3b82f6"/>
    <rect x="1000" y="50" width="140" height="6" rx="3" fill="#3b82f6"/>
  </g>

  <!-- Vite logo: stylized lightning-bolt triangle on the left, with the brand gradients -->
  <g transform="translate(110 200)">
    <!-- Outer triangle (purple→cyan gradient) -->
    <path d="M 0 0 L 240 0 L 120 280 Z" fill="url(#vite-purple)"/>
    <!-- Inner lightning bolt (yellow gradient) -->
    <path d="M 90 35 L 130 35 L 115 110 L 160 110 L 90 235 L 105 145 L 65 145 Z"
          fill="url(#vite-yellow)" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Big headline -->
  <text x="430" y="225"
        font-family="Inter, system-ui, sans-serif"
        font-size="72" font-weight="800"
        fill="#f8fafc" letter-spacing="-1">Vite</text>

  <text x="430" y="295"
        font-family="Inter, system-ui, sans-serif"
        font-size="36" font-weight="700"
        fill="#60a5fa">vs Webpack</text>

  <text x="430" y="360"
        font-family="Inter, system-ui, sans-serif"
        font-size="24" font-weight="500"
        fill="#cbd5e1">Why it's fast — and what's next</text>

  <!-- Visualised "before / after" timing bars -->
  <g transform="translate(430 410)">
    <!-- Webpack row -->
    <text x="0" y="14" font-family="ui-monospace, Menlo, monospace"
          font-size="16" fill="#94a3b8">webpack</text>
    <rect x="115" y="0" width="540" height="18" rx="4" fill="#475569"/>
    <text x="665" y="14" font-family="ui-monospace, Menlo, monospace"
          font-size="14" fill="#94a3b8">slow cold start</text>

    <!-- Vite row -->
    <text x="0" y="62" font-family="ui-monospace, Menlo, monospace"
          font-size="16" fill="#cbd5e1">vite</text>
    <rect x="115" y="48" width="80" height="18" rx="4" fill="#ffd00f"/>
    <text x="205" y="62" font-family="ui-monospace, Menlo, monospace"
          font-size="14" fill="#fde047">native ESM, instant dev server</text>
  </g>

  <!-- Footer brand mark -->
  <text x="430" y="555"
        font-family="ui-monospace, Menlo, monospace"
        font-size="16" fill="#64748b">cloudmato.com</text>
</svg>
