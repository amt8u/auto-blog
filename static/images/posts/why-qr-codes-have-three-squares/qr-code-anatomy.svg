<svg xmlns="http://www.w3.org/2000/svg" width="700" height="390" viewBox="0 0 700 390">
  <rect width="700" height="390" fill="white"/>
  <!-- QR Code body -->
  <rect x="40" y="40" width="300" height="300" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <!-- Finder: Top-Left -->
  <rect x="55" y="55" width="70" height="70" fill="#333333"/>
  <rect x="65" y="65" width="50" height="50" fill="white"/>
  <rect x="75" y="75" width="30" height="30" fill="#333333"/>
  <!-- Finder: Top-Right -->
  <rect x="255" y="55" width="70" height="70" fill="#333333"/>
  <rect x="265" y="65" width="50" height="50" fill="white"/>
  <rect x="275" y="75" width="30" height="30" fill="#333333"/>
  <!-- Finder: Bottom-Left -->
  <rect x="55" y="255" width="70" height="70" fill="#333333"/>
  <rect x="65" y="265" width="50" height="50" fill="white"/>
  <rect x="75" y="275" width="30" height="30" fill="#333333"/>
  <!-- Timing horizontal -->
  <rect x="135" y="128" width="10" height="10" fill="#333333"/>
  <rect x="155" y="128" width="10" height="10" fill="#333333"/>
  <rect x="175" y="128" width="10" height="10" fill="#333333"/>
  <rect x="195" y="128" width="10" height="10" fill="#333333"/>
  <rect x="215" y="128" width="10" height="10" fill="#333333"/>
  <!-- Timing vertical -->
  <rect x="128" y="135" width="10" height="10" fill="#333333"/>
  <rect x="128" y="155" width="10" height="10" fill="#333333"/>
  <rect x="128" y="175" width="10" height="10" fill="#333333"/>
  <rect x="128" y="195" width="10" height="10" fill="#333333"/>
  <rect x="128" y="215" width="10" height="10" fill="#333333"/>
  <!-- Data region dots -->
  <rect x="150" y="155" width="10" height="10" fill="#333333"/>
  <rect x="170" y="155" width="10" height="10" fill="#333333"/>
  <rect x="200" y="155" width="10" height="10" fill="#333333"/>
  <rect x="150" y="175" width="10" height="10" fill="#333333"/>
  <rect x="190" y="175" width="10" height="10" fill="#333333"/>
  <rect x="220" y="175" width="10" height="10" fill="#333333"/>
  <rect x="160" y="195" width="10" height="10" fill="#333333"/>
  <rect x="180" y="195" width="10" height="10" fill="#333333"/>
  <rect x="210" y="195" width="10" height="10" fill="#333333"/>
  <rect x="240" y="175" width="10" height="10" fill="#333333"/>
  <rect x="155" y="215" width="10" height="10" fill="#333333"/>
  <rect x="195" y="215" width="10" height="10" fill="#333333"/>
  <rect x="235" y="195" width="10" height="10" fill="#333333"/>
  <rect x="165" y="235" width="10" height="10" fill="#333333"/>
  <rect x="215" y="235" width="10" height="10" fill="#333333"/>
  <rect x="245" y="215" width="10" height="10" fill="#333333"/>
  <!-- Alignment pattern bottom-right -->
  <rect x="248" y="248" width="30" height="30" fill="#333333"/>
  <rect x="253" y="253" width="20" height="20" fill="white"/>
  <rect x="258" y="258" width="10" height="10" fill="#333333"/>
  <!-- Quiet zone dashed border -->
  <rect x="28" y="28" width="324" height="324" fill="none" stroke="#4a90e2" stroke-width="1.2" stroke-dasharray="5,4"/>
  <!-- Annotation lines and labels -->
  <!-- Finder patterns -->
  <line x1="128" y1="88" x2="420" y2="65" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="425" y="61" font-family="sans-serif" font-size="13" fill="#333333" font-weight="bold">Finder Patterns (×3)</text>
  <text x="425" y="78" font-family="sans-serif" font-size="11" fill="#666666">Top-left, top-right, bottom-left only</text>
  <text x="425" y="94" font-family="sans-serif" font-size="11" fill="#666666">Ratio 1:1:3:1:1 — detects and orients the code</text>
  <!-- Timing -->
  <line x1="175" y1="128" x2="420" y2="148" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="425" y="144" font-family="sans-serif" font-size="13" fill="#333333" font-weight="bold">Timing Patterns</text>
  <text x="425" y="161" font-family="sans-serif" font-size="11" fill="#666666">Alternating row + column — defines the module grid</text>
  <!-- Data -->
  <line x1="210" y1="200" x2="420" y2="225" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="425" y="221" font-family="sans-serif" font-size="13" fill="#333333" font-weight="bold">Data + Error Correction</text>
  <text x="425" y="238" font-family="sans-serif" font-size="11" fill="#666666">Encoded payload + Reed-Solomon redundancy</text>
  <!-- Alignment -->
  <line x1="278" y1="268" x2="420" y2="290" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="425" y="286" font-family="sans-serif" font-size="13" fill="#333333" font-weight="bold">Alignment Pattern</text>
  <text x="425" y="303" font-family="sans-serif" font-size="11" fill="#666666">Corrects distortion (Version 2+ only)</text>
  <!-- Quiet zone -->
  <line x1="352" y1="348" x2="420" y2="348" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="425" y="344" font-family="sans-serif" font-size="13" fill="#333333" font-weight="bold">Quiet Zone</text>
  <text x="425" y="361" font-family="sans-serif" font-size="11" fill="#666666">Min. 4-module blank border — ISO 18004</text>
  <!-- Caption -->
  <text x="190" y="375" font-family="sans-serif" font-size="11" fill="#aaaaaa" text-anchor="middle">QR Code Anatomy</text>
</svg>