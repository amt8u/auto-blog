<svg xmlns="http://www.w3.org/2000/svg" width="700" height="240" viewBox="0 0 700 240">
  <rect width="700" height="240" fill="white"/>
  <text x="350" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#333333">Client follows server-provided links (no hardcoded URLs)</text>
  <rect x="30" y="90" width="150" height="70" fill="#f0f4f8" stroke="#333333"/>
  <text x="105" y="120" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333333">Order = PENDING</text>
  <text x="105" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4a90e2">links: pay, cancel</text>
  <rect x="275" y="90" width="150" height="70" fill="#f0f4f8" stroke="#333333"/>
  <text x="350" y="120" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333333">Order = PAID</text>
  <text x="350" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4a90e2">links: refund, ship</text>
  <rect x="520" y="90" width="150" height="70" fill="#f0f4f8" stroke="#333333"/>
  <text x="595" y="120" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333333">Order = SHIPPED</text>
  <text x="595" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4a90e2">links: track</text>
  <line x1="180" y1="125" x2="273" y2="125" stroke="#4a90e2" stroke-width="2" marker-end="url(#a)"/>
  <line x1="425" y1="125" x2="518" y2="125" stroke="#4a90e2" stroke-width="2" marker-end="url(#a)"/>
  <text x="226" y="115" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">follow "pay"</text>
  <text x="471" y="115" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">follow "ship"</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a90e2"/>
    </marker>
  </defs>
</svg>