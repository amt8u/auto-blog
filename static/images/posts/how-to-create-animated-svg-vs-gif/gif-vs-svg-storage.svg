<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380" viewBox="0 0 700 380">
  <rect width="700" height="380" fill="#ffffff"/>
  <text x="160" y="30" font-size="20" font-weight="bold" fill="#333333" text-anchor="middle">GIF: stores every frame</text>
  <rect x="60" y="50" width="200" height="40" fill="#f0f4f8" stroke="#333333"/>
  <text x="160" y="75" font-size="13" fill="#333333" text-anchor="middle">Frame 1 (full raster image)</text>
  <rect x="60" y="98" width="200" height="40" fill="#f0f4f8" stroke="#333333"/>
  <text x="160" y="123" font-size="13" fill="#333333" text-anchor="middle">Frame 2 (full raster image)</text>
  <rect x="60" y="146" width="200" height="40" fill="#f0f4f8" stroke="#333333"/>
  <text x="160" y="171" font-size="13" fill="#333333" text-anchor="middle">Frame 3 (full raster image)</text>
  <rect x="60" y="194" width="200" height="40" fill="#f0f4f8" stroke="#333333"/>
  <text x="160" y="219" font-size="13" fill="#333333" text-anchor="middle">... Frame 60</text>
  <text x="160" y="270" font-size="16" font-weight="bold" fill="#4a90e2" text-anchor="middle">Total: ~700 KB</text>
  <text x="160" y="295" font-size="12" fill="#333333" text-anchor="middle">Fixed size, blurry when scaled up</text>

  <text x="540" y="30" font-size="20" font-weight="bold" fill="#333333" text-anchor="middle">SVG: stores shapes + math</text>
  <rect x="440" y="55" width="200" height="55" fill="#f0f4f8" stroke="#333333"/>
  <text x="540" y="78" font-size="13" fill="#333333" text-anchor="middle">Shape definitions</text>
  <text x="540" y="96" font-size="13" fill="#333333" text-anchor="middle">(paths, circles, gradients)</text>

  <line x1="540" y1="110" x2="540" y2="135" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="440" y="138" width="200" height="55" fill="#f0f4f8" stroke="#333333"/>
  <text x="540" y="161" font-size="13" fill="#333333" text-anchor="middle">Animation rules</text>
  <text x="540" y="179" font-size="13" fill="#333333" text-anchor="middle">(CSS, SMIL, or JS)</text>

  <line x1="540" y1="193" x2="540" y2="218" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="410" y="221" width="260" height="55" fill="#f0f4f8" stroke="#333333"/>
  <text x="540" y="244" font-size="13" fill="#333333" text-anchor="middle">Browser renders it live</text>
  <text x="540" y="262" font-size="13" fill="#333333" text-anchor="middle">at any size, any zoom level</text>

  <text x="540" y="320" font-size="16" font-weight="bold" fill="#4a90e2" text-anchor="middle">Total: ~10-50 KB</text>
  <text x="540" y="345" font-size="12" fill="#333333" text-anchor="middle">Crisp at any resolution</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a90e2"/>
    </marker>
  </defs>

  <line x1="350" y1="20" x2="350" y2="350" stroke="#cccccc" stroke-width="1" stroke-dasharray="4"/>
</svg>