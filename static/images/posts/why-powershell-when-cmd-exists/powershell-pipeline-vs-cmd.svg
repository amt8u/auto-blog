<svg xmlns="http://www.w3.org/2000/svg" width="700" height="260" viewBox="0 0 700 260">
  <!-- Background -->
  <rect width="700" height="260" fill="white"/>
  <!-- CMD Side -->
  <rect x="20" y="30" width="290" height="200" rx="8" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="165" y="58" font-family="monospace" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">CMD Pipeline</text>
  <rect x="40" y="72" width="250" height="36" rx="4" fill="#333333"/>
  <text x="165" y="95" font-family="monospace" font-size="11" fill="white" text-anchor="middle">tasklist /NH | sort /R /+65</text>
  <text x="165" y="128" font-family="monospace" font-size="10" fill="#333333" text-anchor="middle">Output is raw text strings</text>
  <text x="165" y="148" font-family="monospace" font-size="10" fill="#333333" text-anchor="middle">Parse by character position</text>
  <text x="165" y="168" font-family="monospace" font-size="10" fill="#333333" text-anchor="middle">Breaks if column width changes</text>
  <text x="165" y="200" font-family="monospace" font-size="10" fill="#e05252" text-anchor="middle" font-weight="bold">⚠ Fragile. Hard to maintain.</text>
  <!-- Arrow -->
  <text x="350" y="138" font-family="sans-serif" font-size="22" fill="#4a90e2" text-anchor="middle">→</text>
  <!-- PowerShell Side -->
  <rect x="390" y="30" width="290" height="200" rx="8" fill="#f0f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="535" y="58" font-family="monospace" font-size="14" font-weight="bold" fill="#4a90e2" text-anchor="middle">PowerShell Pipeline</text>
  <rect x="410" y="72" width="250" height="36" rx="4" fill="#333333"/>
  <text x="535" y="88" font-family="monospace" font-size="10" fill="white" text-anchor="middle">Get-Process |</text>
  <text x="535" y="102" font-family="monospace" font-size="10" fill="white" text-anchor="middle">Sort-Object CPU -Descending</text>
  <text x="535" y="128" font-family="monospace" font-size="10" fill="#333333" text-anchor="middle">Output is .NET objects</text>
  <text x="535" y="148" font-family="monospace" font-size="10" fill="#333333" text-anchor="middle">Access by property name (CPU, Name)</text>
  <text x="535" y="168" font-family="monospace" font-size="10" fill="#333333" text-anchor="middle">Survives format/column changes</text>
  <text x="535" y="200" font-family="monospace" font-size="10" fill="#3a8a3a" text-anchor="middle" font-weight="bold">✓ Reliable. Self-documenting.</text>
</svg>