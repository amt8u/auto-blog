<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0d2342"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#fb923c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#1e3a5f" stroke-width="1" opacity="0.4">
    <line x1="0"    y1="90"  x2="1200" y2="90"/>
    <line x1="0"    y1="180" x2="1200" y2="180"/>
    <line x1="0"    y1="270" x2="1200" y2="270"/>
    <line x1="0"    y1="360" x2="1200" y2="360"/>
    <line x1="0"    y1="450" x2="1200" y2="450"/>
    <line x1="0"    y1="540" x2="1200" y2="540"/>
    <line x1="150"  y1="0"   x2="150"  y2="630"/>
    <line x1="300"  y1="0"   x2="300"  y2="630"/>
    <line x1="450"  y1="0"   x2="450"  y2="630"/>
    <line x1="600"  y1="0"   x2="600"  y2="630"/>
    <line x1="750"  y1="0"   x2="750"  y2="630"/>
    <line x1="900"  y1="0"   x2="900"  y2="630"/>
    <line x1="1050" y1="0"   x2="1050" y2="630"/>
  </g>

  <!-- Orange accent bar top -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- Shield icon (left) -->
  <g transform="translate(130, 220)" filter="url(#glow)">
    <path d="M70,0 L140,35 L140,100 C140,145 70,175 70,175 C70,175 0,145 0,100 L0,35 Z"
          fill="none" stroke="#f97316" stroke-width="3" opacity="0.9"/>
    <!-- Lock inside shield -->
    <rect x="47" y="85" width="46" height="38" rx="4" fill="none" stroke="#f97316" stroke-width="2.5"/>
    <path d="M55,85 L55,72 C55,57 85,57 85,72 L85,85" fill="none" stroke="#f97316" stroke-width="2.5"/>
    <circle cx="70" cy="102" r="5" fill="#f97316"/>
    <line x1="70" y1="107" x2="70" y2="115" stroke="#f97316" stroke-width="2.5"/>
    <!-- Alert mark through shield -->
    <line x1="15" y1="15" x2="125" y2="160" stroke="#ef4444" stroke-width="3" opacity="0.7"/>
  </g>

  <!-- CBSE label -->
  <rect x="300" y="170" width="8" height="60" fill="url(#accent)" rx="2"/>
  <text x="326" y="213" font-family="'Georgia', serif" font-size="72" font-weight="700"
        fill="white" letter-spacing="6">CBSE</text>

  <!-- Breach headline -->
  <text x="326" y="268" font-family="system-ui, sans-serif" font-size="26" font-weight="400"
        fill="#94a3b8" letter-spacing="2">PORTAL SECURITY BREACH · 2026</text>

  <!-- Divider -->
  <line x1="326" y1="295" x2="900" y2="295" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- Key stats row -->
  <!-- Stat 1 -->
  <text x="326" y="350" font-family="system-ui, sans-serif" font-size="42" font-weight="700"
        fill="#f97316">20L+</text>
  <text x="326" y="378" font-family="system-ui, sans-serif" font-size="14" fill="#64748b"
        letter-spacing="1">STUDENTS AFFECTED</text>

  <!-- Stat 2 -->
  <text x="540" y="350" font-family="system-ui, sans-serif" font-size="42" font-weight="700"
        fill="#f97316">6</text>
  <text x="540" y="378" font-family="system-ui, sans-serif" font-size="14" fill="#64748b"
        letter-spacing="1">CRITICAL VULNERABILITIES</text>

  <!-- Stat 3 -->
  <text x="760" y="350" font-family="system-ui, sans-serif" font-size="42" font-weight="700"
        fill="#f97316">19yr</text>
  <text x="760" y="378" font-family="system-ui, sans-serif" font-size="14" fill="#64748b"
        letter-spacing="1">ETHICAL HACKER</text>

  <!-- Divider 2 -->
  <line x1="326" y1="408" x2="900" y2="408" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- Tag chips -->
  <rect x="326" y="428" width="130" height="30" rx="15" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
  <text x="391" y="448" font-family="system-ui, sans-serif" font-size="12" fill="#64748b"
        text-anchor="middle" letter-spacing="1">CYBERSECURITY</text>

  <rect x="472" y="428" width="96" height="30" rx="15" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
  <text x="520" y="448" font-family="system-ui, sans-serif" font-size="12" fill="#64748b"
        text-anchor="middle" letter-spacing="1">EDUCATION</text>

  <rect x="584" y="428" width="72" height="30" rx="15" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
  <text x="620" y="448" font-family="system-ui, sans-serif" font-size="12" fill="#64748b"
        text-anchor="middle" letter-spacing="1">INDIA</text>

  <!-- Cloudmato watermark -->
  <text x="1170" y="618" font-family="system-ui, sans-serif" font-size="13" fill="#1e3a5f"
        text-anchor="end" letter-spacing="1">cloudmato.com</text>

  <!-- Orange accent bar bottom -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#accent)" opacity="0.4"/>
</svg>
