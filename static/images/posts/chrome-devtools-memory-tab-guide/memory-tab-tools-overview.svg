<svg xmlns="http://www.w3.org/2000/svg" width="700" height="240" viewBox="0 0 700 240">
  <!-- Background -->
  <rect width="700" height="240" fill="white"/>
  <!-- Title -->
  <text x="350" y="28" font-family="monospace" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">Chrome DevTools Memory Tab — Four Profiling Types</text>
  <!-- Box 1: Heap Snapshot -->
  <rect x="20" y="50" width="150" height="80" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.2"/>
  <text x="95" y="72" font-family="monospace" font-size="11" fill="#333333" text-anchor="middle" font-weight="bold">Heap Snapshot</text>
  <text x="95" y="90" font-family="monospace" font-size="10" fill="#555" text-anchor="middle">Point-in-time</text>
  <text x="95" y="106" font-family="monospace" font-size="10" fill="#555" text-anchor="middle">heap photo</text>
  <text x="95" y="122" font-family="monospace" font-size="9" fill="#4a90e2" text-anchor="middle">Compare snapshots</text>
  <!-- Box 2: Allocation Timeline -->
  <rect x="190" y="50" width="150" height="80" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.2"/>
  <text x="265" y="72" font-family="monospace" font-size="11" fill="#333333" text-anchor="middle" font-weight="bold">Alloc. Timeline</text>
  <text x="265" y="90" font-family="monospace" font-size="10" fill="#555" text-anchor="middle">Live recording</text>
  <text x="265" y="106" font-family="monospace" font-size="10" fill="#555" text-anchor="middle">of allocations</text>
  <text x="265" y="122" font-family="monospace" font-size="9" fill="#4a90e2" text-anchor="middle">Blue = live, Grey = GC'd</text>
  <!-- Box 3: Allocation Sampling -->
  <rect x="360" y="50" width="150" height="80" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.2"/>
  <text x="435" y="72" font-family="monospace" font-size="11" fill="#333333" text-anchor="middle" font-weight="bold">Alloc. Sampling</text>
  <text x="435" y="90" font-family="monospace" font-size="10" fill="#555" text-anchor="middle">Statistical, low</text>
  <text x="435" y="106" font-family="monospace" font-size="10" fill="#555" text-anchor="middle">overhead profiling</text>
  <text x="435" y="122" font-family="monospace" font-size="9" fill="#4a90e2" text-anchor="middle">Per-function breakdown</text>
  <!-- Box 4: Detached Elements -->
  <rect x="530" y="50" width="150" height="80" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.2"/>
  <text x="605" y="72" font-family="monospace" font-size="11" fill="#333333" text-anchor="middle" font-weight="bold">Detached Elems</text>
  <text x="605" y="90" font-family="monospace" font-size="10" fill="#555" text-anchor="middle">Orphaned DOM</text>
  <text x="605" y="106" font-family="monospace" font-size="10" fill="#555" text-anchor="middle">nodes still held</text>
  <text x="605" y="122" font-family="monospace" font-size="9" fill="#4a90e2" text-anchor="middle">Direct JS refs shown</text>
  <!-- Arrows / connectors -->
  <line x1="170" y1="90" x2="190" y2="90" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="90" x2="360" y2="90" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="90" x2="530" y2="90" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Bottom label -->
  <text x="350" y="170" font-family="monospace" font-size="11" fill="#333333" text-anchor="middle">Open DevTools → Memory panel → select profiling type → click Start / Take snapshot</text>
  <text x="350" y="190" font-family="monospace" font-size="10" fill="#888" text-anchor="middle">Each type answers a different question about your app's memory usage</text>
</svg>