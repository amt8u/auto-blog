<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380" viewBox="0 0 700 380">
  <rect width="700" height="380" fill="#ffffff"/>
  <text x="350" y="20" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333333" font-weight="bold">Main thread flame chart — time flows right, call depth flows down</text>

  <!-- long task indicator -->
  <line x1="60" y1="42" x2="580" y2="42" stroke="#d9534f" stroke-width="2"/>
  <text x="320" y="35" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#d9534f">Long task ≈ 310ms (blocks input)</text>
  <polygon points="560,50 580,50 580,58" fill="#d9534f"/>

  <!-- depth 0 -->
  <rect x="60" y="50" width="520" height="28" fill="#f0f4f8" stroke="#333333"/>
  <text x="320" y="68" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333333">(anonymous) — onClick handler</text>

  <!-- depth 1 -->
  <rect x="60" y="88" width="210" height="28" fill="#f0f4f8" stroke="#333333"/>
  <text x="165" y="106" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333333">processData()</text>

  <rect x="280" y="88" width="300" height="28" fill="#f0f4f8" stroke="#333333"/>
  <text x="430" y="106" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333333">renderList()</text>

  <!-- depth 2 -->
  <rect x="60" y="126" width="130" height="28" fill="#f0f4f8" stroke="#333333"/>
  <text x="125" y="144" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333333">JSON.parse()</text>

  <rect x="280" y="126" width="140" height="28" fill="#f0f4f8" stroke="#333333"/>
  <text x="350" y="144" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">calculateLayout()</text>

  <rect x="430" y="126" width="150" height="28" fill="#4a90e2" stroke="#333333"/>
  <text x="505" y="144" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">updateDOM()</text>

  <!-- depth 3 -->
  <rect x="430" y="164" width="150" height="28" fill="#4a90e2" stroke="#333333"/>
  <text x="505" y="182" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">Layout (reflow)</text>

  <!-- 50ms threshold marker -->
  <line x1="160" y1="45" x2="160" y2="225" stroke="#d9534f" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="166" y="218" font-family="sans-serif" font-size="11" fill="#d9534f">50ms threshold</text>

  <!-- axis -->
  <line x1="60" y1="225" x2="660" y2="225" stroke="#333333" stroke-width="1"/>
  <text x="60" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">0</text>
  <text x="160" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">50</text>
  <text x="260" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">100</text>
  <text x="360" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">150</text>
  <text x="460" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">200</text>
  <text x="560" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">250</text>
  <text x="660" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">300 ms</text>

  <!-- legend -->
  <rect x="60" y="270" width="20" height="20" fill="#f0f4f8" stroke="#333333"/>
  <text x="90" y="285" font-family="sans-serif" font-size="12" fill="#333333">JavaScript execution (Scripting)</text>

  <rect x="60" y="300" width="20" height="20" fill="#4a90e2" stroke="#333333"/>
  <text x="90" y="315" font-family="sans-serif" font-size="12" fill="#333333">Rendering / Layout / Paint work</text>

  <polygon points="60,338 80,338 80,348" fill="#d9534f"/>
  <text x="90" y="345" font-family="sans-serif" font-size="12" fill="#333333">Red marker = long task / over budget (&gt;50ms)</text>
</svg>