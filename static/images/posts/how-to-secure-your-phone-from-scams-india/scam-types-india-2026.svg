<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320">
  <!-- background -->
  <rect width="700" height="320" fill="white"/>
  <text x="350" y="30" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#333333" text-anchor="middle">Top Phone Scam Types in India (2026) — Share of Money Lost</text>
  <!-- Bar chart -->
  <!-- Investment Scams 76% -->
  <rect x="60" y="55" width="456" height="38" rx="4" fill="#4a90e2"/>
  <text x="55" y="79" font-family="Arial,sans-serif" font-size="12" fill="#333333" text-anchor="end">Investment Scams</text>
  <text x="524" y="79" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#333333">76%</text>
  <!-- UPI/Payment Fraud 12% -->
  <rect x="60" y="110" width="72" height="38" rx="4" fill="#4a90e2"/>
  <text x="55" y="134" font-family="Arial,sans-serif" font-size="12" fill="#333333" text-anchor="end">UPI / Payment</text>
  <text x="140" y="134" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#333333">12%</text>
  <!-- Digital Arrest 7% -->
  <rect x="60" y="165" width="42" height="38" rx="4" fill="#4a90e2"/>
  <text x="55" y="189" font-family="Arial,sans-serif" font-size="12" fill="#333333" text-anchor="end">Digital Arrest</text>
  <text x="110" y="189" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#333333">7%</text>
  <!-- eSIM / SIM Swap 3% -->
  <rect x="60" y="220" width="18" height="38" rx="4" fill="#4a90e2"/>
  <text x="55" y="244" font-family="Arial,sans-serif" font-size="12" fill="#333333" text-anchor="end">eSIM / SIM Swap</text>
  <text x="86" y="244" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#333333">3%</text>
  <!-- Other 2% -->
  <rect x="60" y="275" width="12" height="28" rx="4" fill="#f0f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="55" y="294" font-family="Arial,sans-serif" font-size="12" fill="#333333" text-anchor="end">Other</text>
  <text x="80" y="294" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#333333">2%</text>
</svg>