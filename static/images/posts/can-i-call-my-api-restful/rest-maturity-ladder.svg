<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320">
  <rect width="700" height="320" fill="white"/>
  <text x="350" y="30" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333333">Richardson Maturity Model</text>
  <rect x="60" y="250" width="150" height="40" fill="#f0f4f8" stroke="#333333"/>
  <text x="135" y="275" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333333">Level 0: One URI</text>
  <rect x="200" y="190" width="150" height="40" fill="#f0f4f8" stroke="#333333"/>
  <text x="275" y="215" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333333">Level 1: Resources</text>
  <rect x="340" y="130" width="150" height="40" fill="#4a90e2" stroke="#333333"/>
  <text x="415" y="155" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white">Level 2: HTTP Verbs</text>
  <rect x="480" y="70" width="160" height="40" fill="#f0f4f8" stroke="#333333"/>
  <text x="560" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333333">Level 3: HATEOAS</text>
  <text x="415" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4a90e2">← most "REST" APIs live here</text>
  <text x="560" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">← Fielding's "true" REST</text>
  <line x1="40" y1="300" x2="660" y2="300" stroke="#333333" stroke-width="1"/>
  <text x="350" y="316" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">increasing RESTfulness →</text>
</svg>