<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320">
  <rect width="700" height="320" fill="white"/>
  <text x="350" y="30" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333333" font-weight="bold">The Agentic Loop</text>
  <rect x="280" y="55" width="140" height="50" rx="6" fill="#f0f4f8" stroke="#333333"/>
  <text x="350" y="85" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333333">1. Perceive</text>
  <rect x="500" y="135" width="140" height="50" rx="6" fill="#f0f4f8" stroke="#333333"/>
  <text x="570" y="165" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333333">2. Decide</text>
  <rect x="280" y="215" width="140" height="50" rx="6" fill="#f0f4f8" stroke="#333333"/>
  <text x="350" y="245" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333333">3. Act (tool)</text>
  <rect x="60" y="135" width="140" height="50" rx="6" fill="#f0f4f8" stroke="#333333"/>
  <text x="130" y="165" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333333">4. Observe</text>
  <line x1="420" y1="80" x2="500" y2="150" stroke="#4a90e2" stroke-width="2" marker-end="url(#a)"/>
  <line x1="570" y1="185" x2="420" y2="240" stroke="#4a90e2" stroke-width="2" marker-end="url(#a)"/>
  <line x1="280" y1="240" x2="130" y2="185" stroke="#4a90e2" stroke-width="2" marker-end="url(#a)"/>
  <line x1="130" y1="135" x2="280" y2="80" stroke="#4a90e2" stroke-width="2" marker-end="url(#a)"/>
  <text x="350" y="160" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4a90e2" font-style="italic">repeat until done</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a90e2"/>
    </marker>
  </defs>
</svg>