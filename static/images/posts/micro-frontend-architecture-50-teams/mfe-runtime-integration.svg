<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360">
  <rect width="700" height="360" fill="white"/>
  <rect x="250" y="14" width="200" height="48" rx="8" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="350" y="34" text-anchor="middle" font-family="monospace" font-size="13" fill="#333333">Shell / Host App</text>
  <text x="350" y="52" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">owns routing, auth, layout</text>
  <line x1="155" y1="62" x2="130" y2="108" stroke="#4a90e2" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="350" y1="62" x2="350" y2="108" stroke="#4a90e2" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="545" y1="62" x2="570" y2="108" stroke="#4a90e2" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="30" y="108" width="200" height="64" rx="8" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="130" y="130" text-anchor="middle" font-family="monospace" font-size="12" fill="#333333">Module Federation 2.0</text>
  <text x="130" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">Webpack / Rspack / Vite</text>
  <text x="130" y="164" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4a90e2">Best for existing webpack setups</text>
  <rect x="250" y="108" width="200" height="64" rx="8" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="350" y="130" text-anchor="middle" font-family="monospace" font-size="12" fill="#333333">Import Maps</text>
  <text x="350" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">Browser-native ESM</text>
  <text x="350" y="164" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4a90e2">Shell controls all shared versions</text>
  <rect x="470" y="108" width="200" height="64" rx="8" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="570" y="130" text-anchor="middle" font-family="monospace" font-size="12" fill="#333333">Native Federation</text>
  <text x="570" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">ESM + Import Maps, no webpack</text>
  <text x="570" y="164" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4a90e2">Best for new Vite/ESM setups</text>
  <rect x="175" y="258" width="350" height="64" rx="8" fill="#f0f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="280" text-anchor="middle" font-family="monospace" font-size="13" fill="#333333">Shared Kernel (packages/)</text>
  <text x="350" y="298" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">React · Design Tokens · Auth · i18n · Utils</text>
  <text x="350" y="314" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#666">singleton: true — one instance loaded regardless of approach</text>
  <line x1="130" y1="172" x2="270" y2="258" stroke="#4a90e2" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="350" y1="172" x2="350" y2="258" stroke="#4a90e2" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="570" y1="172" x2="430" y2="258" stroke="#4a90e2" stroke-width="1.5" stroke-dasharray="6,3"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="350" y="348" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#999">All three approaches load the shared kernel as singletons at runtime</text>
</svg>