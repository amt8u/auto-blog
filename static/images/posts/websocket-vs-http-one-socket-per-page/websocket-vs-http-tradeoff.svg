<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380" viewBox="0 0 700 380">
  <rect width="700" height="380" fill="#ffffff"/>
  <text x="350" y="30" font-family="Arial" font-size="18" fill="#333333" text-anchor="middle" font-weight="bold">Stateless HTTP vs. Stateful WebSocket — what each costs you</text>

  <!-- HTTP side -->
  <rect x="40" y="60" width="280" height="140" rx="8" fill="#f0f4f8" stroke="#4a90e2"/>
  <text x="180" y="85" font-family="Arial" font-size="15" fill="#333333" text-anchor="middle" font-weight="bold">HTTP (stateless)</text>
  <text x="60" y="112" font-family="Arial" font-size="12" fill="#333333">+ Any server can answer any request</text>
  <text x="60" y="134" font-family="Arial" font-size="12" fill="#333333">+ CDNs and proxies can cache responses</text>
  <text x="60" y="156" font-family="Arial" font-size="12" fill="#333333">+ Easy to scale horizontally</text>
  <text x="60" y="178" font-family="Arial" font-size="12" fill="#333333">- Repeats headers on every call</text>

  <!-- WebSocket side -->
  <rect x="380" y="60" width="280" height="140" rx="8" fill="#f0f4f8" stroke="#4a90e2"/>
  <text x="520" y="85" font-family="Arial" font-size="15" fill="#333333" text-anchor="middle" font-weight="bold">WebSocket (stateful)</text>
  <text x="400" y="112" font-family="Arial" font-size="12" fill="#333333">+ Server can push data anytime</text>
  <text x="400" y="134" font-family="Arial" font-size="12" fill="#333333">+ Tiny per-message overhead</text>
  <text x="400" y="156" font-family="Arial" font-size="12" fill="#333333">- Needs sticky sessions / shared state</text>
  <text x="400" y="178" font-family="Arial" font-size="12" fill="#333333">- Memory + file descriptor per connection</text>

  <!-- Bottom: hybrid -->
  <rect x="160" y="250" width="380" height="100" rx="8" fill="#ffffff" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="278" font-family="Arial" font-size="15" fill="#333333" text-anchor="middle" font-weight="bold">What most real apps actually do</text>
  <text x="350" y="302" font-family="Arial" font-size="12" fill="#333333" text-anchor="middle">REST/HTTP for page loads, auth, CRUD, caching</text>
  <text x="350" y="322" font-family="Arial" font-size="12" fill="#333333" text-anchor="middle">+ ONE WebSocket only for live, push-based events</text>

  <line x1="180" y1="200" x2="300" y2="250" stroke="#4a90e2" stroke-width="2"/>
  <line x1="520" y1="200" x2="400" y2="250" stroke="#4a90e2" stroke-width="2"/>
</svg>