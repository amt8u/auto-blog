<svg xmlns="http://www.w3.org/2000/svg" width="700" height="160" viewBox="0 0 700 160">
  <!-- Background -->
  <rect width="700" height="160" fill="white"/>

  <!-- App Server Box -->
  <rect x="20" y="50" width="150" height="60" rx="8" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="95" y="77" font-family="sans-serif" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">App Backend</text>
  <text x="95" y="96" font-family="sans-serif" font-size="11" fill="#333333" text-anchor="middle">Server</text>

  <!-- Arrow 1 -->
  <line x1="172" y1="80" x2="258" y2="80" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="215" y="70" font-family="sans-serif" font-size="10" fill="#4a90e2" text-anchor="middle">payload +</text>
  <text x="215" y="100" font-family="sans-serif" font-size="10" fill="#4a90e2" text-anchor="middle">device token</text>

  <!-- Gateway Box -->
  <rect x="260" y="35" width="180" height="90" rx="8" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="350" y="67" font-family="sans-serif" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">Push Gateway</text>
  <text x="350" y="86" font-family="sans-serif" font-size="11" fill="#333333" text-anchor="middle">APNs (iOS)</text>
  <text x="350" y="105" font-family="sans-serif" font-size="11" fill="#333333" text-anchor="middle">FCM (Android)</text>

  <!-- Arrow 2 -->
  <line x1="442" y1="80" x2="528" y2="80" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="485" y="70" font-family="sans-serif" font-size="10" fill="#4a90e2" text-anchor="middle">push via</text>
  <text x="485" y="100" font-family="sans-serif" font-size="10" fill="#4a90e2" text-anchor="middle">persistent conn.</text>

  <!-- Device Box -->
  <rect x="530" y="50" width="150" height="60" rx="8" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="605" y="77" font-family="sans-serif" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">User Device</text>
  <text x="605" y="96" font-family="sans-serif" font-size="11" fill="#333333" text-anchor="middle">iPhone / Android</text>

  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4a90e2"/>
    </marker>
  </defs>
</svg>