<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320">
  <rect width="700" height="320" fill="white"/>
  <text x="350" y="30" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333333" font-weight="bold">What each security header defends against</text>
  <rect x="30" y="60" width="200" height="60" rx="6" fill="#f0f4f8" stroke="#333333"/>
  <text x="130" y="90" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333333" font-weight="bold">Strict-Transport-Security</text>
  <text x="130" y="108" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">SSL stripping / MITM</text>
  <rect x="250" y="60" width="200" height="60" rx="6" fill="#f0f4f8" stroke="#333333"/>
  <text x="350" y="90" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333333" font-weight="bold">Content-Security-Policy</text>
  <text x="350" y="108" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">Injection / mixed content</text>
  <rect x="470" y="60" width="200" height="60" rx="6" fill="#f0f4f8" stroke="#333333"/>
  <text x="570" y="90" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333333" font-weight="bold">X-Frame-Options</text>
  <text x="570" y="108" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">Clickjacking</text>
  <rect x="30" y="150" width="200" height="60" rx="6" fill="#f0f4f8" stroke="#333333"/>
  <text x="130" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333333" font-weight="bold">X-Content-Type-Options</text>
  <text x="130" y="198" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">MIME sniffing attacks</text>
  <rect x="250" y="150" width="200" height="60" rx="6" fill="#f0f4f8" stroke="#333333"/>
  <text x="350" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333333" font-weight="bold">Secure cookies</text>
  <text x="350" y="198" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">Session hijacking</text>
  <rect x="470" y="150" width="200" height="60" rx="6" fill="#f0f4f8" stroke="#333333"/>
  <text x="570" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333333" font-weight="bold">X-XSS-Protection</text>
  <text x="570" y="198" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">Legacy / deprecated</text>
  <text x="350" y="270" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4a90e2" font-weight="bold">Defence in depth — no single header does it all</text>
</svg>