  <text x="100" y="85" text-anchor="middle" font-family="sans-serif" font-size="11" fill="white">Partition 0 (Leader)</text>
  <rect x="45" y="115" width="110" height="40" rx="4" fill="#f0f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="100" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">Partition 1 (Follower)</text>
  <rect x="45" y="170" width="110" height="40" rx="4" fill="#f0f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="100" y="195" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">Partition 2 (Follower)</text>

  <rect x="280" y="40" width="140" height="240" rx="8" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="350" y="30" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333333" font-weight="bold">Broker 2</text>
  <rect x="295" y="60" width="110" height="40" rx="4" fill="#f0f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="350" y="85" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">Partition 0 (Follower)</text>
  <rect x="295" y="115" width="110" height="40" rx="4" fill="#4a90e2" opacity="0.85"/>
  <text x="350" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="white">Partition 1 (Leader)</text>
  <rect x="295" y="170" width="110" height="40" rx="4" fill="#f0f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="350" y="195" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">Partition 2 (Follower)</text>

  <rect x="530" y="40" width="140" height="240" rx="8" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="600" y="30" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333333" font-weight="bold">Broker 3</text>
  <rect x="545" y="60" width="110" height="40" rx="4" fill="#f0f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="600" y="85" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">Partition 0 (Follower)</text>
  <rect x="545" y="115" width="110" height="40" rx="4" fill="#f0f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="600" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">Partition 1 (Follower)</text>
  <rect x="545" y="170" width="110" height="40" rx="4" fill="#4a90e2" opacity="0.85"/>
  <text x="600" y="195" text-anchor="middle" font-family="sans-serif" font-size="11" fill="white">Partition 2 (Leader)</text>

  <!-- Labels -->
  <text x="350" y="295" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">Topic "orders" — 3 partitions, replication factor 3. Each broker leads one partition.</text>
