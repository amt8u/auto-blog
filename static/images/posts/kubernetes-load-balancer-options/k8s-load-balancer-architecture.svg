<svg xmlns="http://www.w3.org/2000/svg" width="700" height="375" viewBox="0 0 700 375">
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Background -->
  <rect width="700" height="375" fill="white"/>
  <!-- OUTSIDE label -->
  <text x="14" y="105" font-family="monospace" font-size="10" fill="#aaa">OUTSIDE</text>
  <text x="14" y="119" font-family="monospace" font-size="10" fill="#aaa">CLUSTER</text>
  <!-- Internet box -->
  <rect x="235" y="14" width="230" height="44" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="350" y="33" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#333333">Internet / External Client</text>
  <text x="350" y="51" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666666">HTTP · HTTPS · TCP · UDP</text>
  <!-- Arrow: Internet → External LB -->
  <line x1="350" y1="58" x2="350" y2="79" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- External LB box -->
  <rect x="170" y="81" width="360" height="50" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="350" y="101" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#333333">External Load Balancer</text>
  <text x="350" y="120" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666666">Cloud LB (AWS NLB/ALB · GCP · Azure)  ·  MetalLB on bare metal</text>
  <!-- Cluster boundary dashed line -->
  <line x1="52" y1="150" x2="648" y2="150" stroke="#4a90e2" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="350" y="162" text-anchor="middle" font-family="monospace" font-size="10" fill="#4a90e2">── cluster boundary ──</text>
  <!-- Arrow: External LB → Ingress/Gateway -->
  <line x1="350" y1="131" x2="350" y2="168" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- INSIDE label -->
  <text x="14" y="200" font-family="monospace" font-size="10" fill="#aaa">INSIDE</text>
  <text x="14" y="214" font-family="monospace" font-size="10" fill="#aaa">CLUSTER</text>
  <!-- Ingress/Gateway box -->
  <rect x="160" y="170" width="380" height="50" rx="6" fill="#e8f0fe" stroke="#4a90e2" stroke-width="1.8"/>
  <text x="350" y="191" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#333333">Ingress Controller / Gateway API</text>
  <text x="350" y="209" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555555">nginx · traefik · envoy · istio  ·  TLS termination  ·  path routing</text>
  <!-- Arrow: Ingress → Service A (diagonal left) -->
  <line x1="278" y1="220" x2="178" y2="265" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- Arrow: Ingress → Service B (diagonal right) -->
  <line x1="422" y1="220" x2="522" y2="265" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- Service A box -->
  <rect x="72" y="267" width="212" height="44" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="178" y="285" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333333">Service A (ClusterIP)</text>
  <text x="178" y="303" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#666666">/api/* routes</text>
  <!-- Service B box -->
  <rect x="416" y="267" width="212" height="44" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="522" y="285" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333333">Service B (ClusterIP)</text>
  <text x="522" y="303" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#666666">/web/* routes</text>
  <!-- Arrow: Service A → Pods -->
  <line x1="178" y1="311" x2="178" y2="333" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- Arrow: Service B → Pods -->
  <line x1="522" y1="311" x2="522" y2="333" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- Pod A1 -->
  <rect x="96" y="335" width="72" height="28" rx="4" fill="#f0f4f8" stroke="#333333" stroke-width="1"/>
  <text x="132" y="353" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">Pod A-1</text>
  <!-- Pod A2 -->
  <rect x="178" y="335" width="72" height="28" rx="4" fill="#f0f4f8" stroke="#333333" stroke-width="1"/>
  <text x="214" y="353" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">Pod A-2</text>
  <!-- Pod B1 -->
  <rect x="446" y="335" width="72" height="28" rx="4" fill="#f0f4f8" stroke="#333333" stroke-width="1"/>
  <text x="482" y="353" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">Pod B-1</text>
  <!-- Pod B2 -->
  <rect x="528" y="335" width="72" height="28" rx="4" fill="#f0f4f8" stroke="#333333" stroke-width="1"/>
  <text x="564" y="353" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">Pod B-2</text>
</svg>