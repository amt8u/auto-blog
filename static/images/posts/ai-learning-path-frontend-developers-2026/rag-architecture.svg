<svg xmlns="http://www.w3.org/2000/svg" width="700" height="195" viewBox="0 0 700 195">
  <rect width="700" height="195" fill="white"/>
  <!-- Title -->
  <text x="350" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333" font-family="sans-serif">How RAG Works</text>
  <!-- User Query box -->
  <rect x="20" y="40" width="110" height="45" rx="5" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="75" y="59" text-anchor="middle" font-size="10" font-weight="bold" fill="#333333" font-family="sans-serif">User Query</text>
  <text x="75" y="75" text-anchor="middle" font-size="9" fill="#555" font-family="sans-serif">"How do I reset…"</text>
  <!-- Arrow Query → Embed -->
  <line x1="132" y1="62" x2="158" y2="62" stroke="#4a90e2" stroke-width="2"/>
  <polygon points="156,57 166,62 156,67" fill="#4a90e2"/>
  <!-- Embed box -->
  <rect x="166" y="40" width="110" height="45" rx="5" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="221" y="59" text-anchor="middle" font-size="10" font-weight="bold" fill="#333333" font-family="sans-serif">Embed Query</text>
  <text x="221" y="75" text-anchor="middle" font-size="9" fill="#555" font-family="sans-serif">text → vector</text>
  <!-- Arrow Embed → Vector Search -->
  <line x1="278" y1="62" x2="304" y2="62" stroke="#4a90e2" stroke-width="2"/>
  <polygon points="302,57 312,62 302,67" fill="#4a90e2"/>
  <!-- Vector Search box -->
  <rect x="312" y="40" width="110" height="45" rx="5" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="367" y="59" text-anchor="middle" font-size="10" font-weight="bold" fill="#333333" font-family="sans-serif">Vector Search</text>
  <text x="367" y="75" text-anchor="middle" font-size="9" fill="#555" font-family="sans-serif">top-k similar docs</text>
  <!-- Arrow Vector Search → LLM -->
  <line x1="424" y1="62" x2="450" y2="62" stroke="#4a90e2" stroke-width="2"/>
  <polygon points="448,57 458,62 448,67" fill="#4a90e2"/>
  <!-- LLM box -->
  <rect x="458" y="40" width="110" height="45" rx="5" fill="#4a90e2" stroke="#333333" stroke-width="1.5"/>
  <text x="513" y="59" text-anchor="middle" font-size="10" font-weight="bold" fill="white" font-family="sans-serif">LLM + Context</text>
  <text x="513" y="75" text-anchor="middle" font-size="9" fill="#e0eeff" font-family="sans-serif">query + chunks</text>
  <!-- Arrow LLM → Response -->
  <line x1="570" y1="62" x2="596" y2="62" stroke="#4a90e2" stroke-width="2"/>
  <polygon points="594,57 604,62 594,67" fill="#4a90e2"/>
  <!-- Response box -->
  <rect x="604" y="40" width="82" height="45" rx="5" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="645" y="59" text-anchor="middle" font-size="10" font-weight="bold" fill="#333333" font-family="sans-serif">Response</text>
  <text x="645" y="75" text-anchor="middle" font-size="9" fill="#555" font-family="sans-serif">grounded answer</text>
  <!-- Your Docs label -->
  <rect x="166" y="120" width="110" height="45" rx="5" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="221" y="139" text-anchor="middle" font-size="10" font-weight="bold" fill="#333333" font-family="sans-serif">Your Docs</text>
  <text x="221" y="155" text-anchor="middle" font-size="9" fill="#555" font-family="sans-serif">PDFs, DBs, APIs</text>
  <!-- Arrow Docs → Embed/Index -->
  <line x1="278" y1="142" x2="304" y2="142" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="302,137 312,142 302,147" fill="#333333"/>
  <!-- Chunk & Index box -->
  <rect x="312" y="120" width="110" height="45" rx="5" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="367" y="139" text-anchor="middle" font-size="10" font-weight="bold" fill="#333333" font-family="sans-serif">Chunk &amp; Index</text>
  <text x="367" y="155" text-anchor="middle" font-size="9" fill="#555" font-family="sans-serif">embed + store</text>
  <!-- Arrow Chunk → Vector Search (upward) -->
  <line x1="367" y1="118" x2="367" y2="87" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="362,89 367,79 372,89" fill="#333333"/>
</svg>