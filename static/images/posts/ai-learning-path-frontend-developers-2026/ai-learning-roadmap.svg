<svg xmlns="http://www.w3.org/2000/svg" width="700" height="130" viewBox="0 0 700 130">
  <rect width="700" height="130" fill="white"/>
  <!-- Phase 1 -->
  <rect x="10" y="25" width="90" height="75" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="55" y="48" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a90e2" font-family="sans-serif">Phase 1</text>
  <text x="55" y="63" text-anchor="middle" font-size="9" fill="#333333" font-family="sans-serif">AI Dev</text>
  <text x="55" y="76" text-anchor="middle" font-size="9" fill="#333333" font-family="sans-serif">Tools</text>
  <text x="55" y="91" text-anchor="middle" font-size="8" fill="#888888" font-family="sans-serif">Month 1</text>
  <!-- Arrow 1→2 -->
  <line x1="102" y1="62" x2="120" y2="62" stroke="#4a90e2" stroke-width="2"/>
  <polygon points="120,57 130,62 120,67" fill="#4a90e2"/>
  <!-- Phase 2 -->
  <rect x="130" y="25" width="90" height="75" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="175" y="48" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a90e2" font-family="sans-serif">Phase 2</text>
  <text x="175" y="63" text-anchor="middle" font-size="9" fill="#333333" font-family="sans-serif">LLM API</text>
  <text x="175" y="76" text-anchor="middle" font-size="9" fill="#333333" font-family="sans-serif">Integration</text>
  <text x="175" y="91" text-anchor="middle" font-size="8" fill="#888888" font-family="sans-serif">Months 1–3</text>
  <!-- Arrow 2→3 -->
  <line x1="222" y1="62" x2="240" y2="62" stroke="#4a90e2" stroke-width="2"/>
  <polygon points="240,57 250,62 240,67" fill="#4a90e2"/>
  <!-- Phase 3 -->
  <rect x="250" y="25" width="90" height="75" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="295" y="48" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a90e2" font-family="sans-serif">Phase 3</text>
  <text x="295" y="63" text-anchor="middle" font-size="9" fill="#333333" font-family="sans-serif">Prompt</text>
  <text x="295" y="76" text-anchor="middle" font-size="9" fill="#333333" font-family="sans-serif">Engineering</text>
  <text x="295" y="91" text-anchor="middle" font-size="8" fill="#888888" font-family="sans-serif">Months 2–4</text>
  <!-- Arrow 3→4 -->
  <line x1="342" y1="62" x2="360" y2="62" stroke="#4a90e2" stroke-width="2"/>
  <polygon points="360,57 370,62 360,67" fill="#4a90e2"/>
  <!-- Phase 4 -->
  <rect x="370" y="25" width="90" height="75" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="415" y="48" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a90e2" font-family="sans-serif">Phase 4</text>
  <text x="415" y="63" text-anchor="middle" font-size="9" fill="#333333" font-family="sans-serif">RAG &amp;</text>
  <text x="415" y="76" text-anchor="middle" font-size="9" fill="#333333" font-family="sans-serif">Vector DB</text>
  <text x="415" y="91" text-anchor="middle" font-size="8" fill="#888888" font-family="sans-serif">Months 3–6</text>
  <!-- Arrow 4→5 -->
  <line x1="462" y1="62" x2="480" y2="62" stroke="#4a90e2" stroke-width="2"/>
  <polygon points="480,57 490,62 480,67" fill="#4a90e2"/>
  <!-- Phase 5 -->
  <rect x="490" y="25" width="90" height="75" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="535" y="48" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a90e2" font-family="sans-serif">Phase 5</text>
  <text x="535" y="63" text-anchor="middle" font-size="9" fill="#333333" font-family="sans-serif">AI Agents</text>
  <text x="535" y="76" text-anchor="middle" font-size="9" fill="#333333" font-family="sans-serif">&amp; MCP</text>
  <text x="535" y="91" text-anchor="middle" font-size="8" fill="#888888" font-family="sans-serif">Months 5–9</text>
  <!-- Arrow 5→6 -->
  <line x1="582" y1="62" x2="600" y2="62" stroke="#4a90e2" stroke-width="2"/>
  <polygon points="600,57 610,62 600,67" fill="#4a90e2"/>
  <!-- Phase 6 -->
  <rect x="610" y="25" width="82" height="75" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="651" y="48" text-anchor="middle" font-size="10" font-weight="bold" fill="#888888" font-family="sans-serif">Phase 6</text>
  <text x="651" y="63" text-anchor="middle" font-size="9" fill="#888888" font-family="sans-serif">Python</text>
  <text x="651" y="76" text-anchor="middle" font-size="9" fill="#888888" font-family="sans-serif">&amp; ML</text>
  <text x="651" y="91" text-anchor="middle" font-size="8" fill="#aaaaaa" font-family="sans-serif">Optional</text>
</svg>