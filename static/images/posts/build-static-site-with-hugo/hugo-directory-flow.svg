<svg xmlns="http://www.w3.org/2000/svg" width="700" height="230" viewBox="0 0 700 230">
  <rect width="700" height="230" fill="white"/>
  <!-- Input boxes -->
  <rect x="20" y="30" width="135" height="38" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="87" y="54" text-anchor="middle" font-size="13" font-family="monospace" fill="#333333">content/</text>
  <rect x="20" y="88" width="135" height="38" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="87" y="112" text-anchor="middle" font-size="13" font-family="monospace" fill="#333333">layouts/</text>
  <rect x="20" y="146" width="135" height="38" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="87" y="170" text-anchor="middle" font-size="13" font-family="monospace" fill="#333333">assets/</text>
  <!-- Connecting lines to hugo box -->
  <line x1="155" y1="49" x2="255" y2="105" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="155" y1="107" x2="255" y2="110" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="155" y1="165" x2="255" y2="115" stroke="#4a90e2" stroke-width="1.5"/>
  <!-- Hugo box -->
  <rect x="255" y="78" width="150" height="64" rx="8" fill="#4a90e2"/>
  <text x="330" y="107" text-anchor="middle" font-size="14" font-weight="bold" font-family="sans-serif" fill="white">hugo build</text>
  <text x="330" y="128" text-anchor="middle" font-size="11" font-family="sans-serif" fill="white">Go templates + Pipes</text>
  <!-- Arrow from Hugo to output -->
  <line x1="405" y1="110" x2="490" y2="110" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Output box -->
  <rect x="490" y="72" width="185" height="76" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="582" y="97" text-anchor="middle" font-size="13" font-family="monospace" fill="#333333">public/</text>
  <text x="582" y="118" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#333333">HTML + CSS + JS</text>
  <text x="582" y="136" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#333333">ready to deploy</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
</svg>