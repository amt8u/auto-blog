<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400">
  <rect width="700" height="400" fill="white"/>

  <!-- Actor boxes -->
  <rect x="10"  y="20" width="130" height="38" rx="5" fill="#f0f4f8" stroke="#333" stroke-width="1.5"/>
  <text x="75"  y="43" text-anchor="middle" font-family="monospace" font-size="12" fill="#333">SPA (Browser)</text>

  <rect x="285" y="20" width="130" height="38" rx="5" fill="#f0f4f8" stroke="#333" stroke-width="1.5"/>
  <text x="350" y="43" text-anchor="middle" font-family="monospace" font-size="12" fill="#333">Auth Server / IdP</text>

  <rect x="560" y="20" width="130" height="38" rx="5" fill="#f0f4f8" stroke="#333" stroke-width="1.5"/>
  <text x="625" y="43" text-anchor="middle" font-family="monospace" font-size="12" fill="#333">Resource API</text>

  <!-- Lifelines -->
  <line x1="75"  y1="58" x2="75"  y2="390" stroke="#ccc" stroke-dasharray="4,3" stroke-width="1"/>
  <line x1="350" y1="58" x2="350" y2="390" stroke="#ccc" stroke-dasharray="4,3" stroke-width="1"/>
  <line x1="625" y1="58" x2="625" y2="390" stroke="#ccc" stroke-dasharray="4,3" stroke-width="1"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#4a90e2"/></marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="1" refY="3" orient="auto"><path d="M8,0 L8,6 L0,3 z" fill="#4a90e2"/></marker>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#e74c3c"/></marker>
    <marker id="a4" markerWidth="8" markerHeight="8" refX="1" refY="3" orient="auto"><path d="M8,0 L8,6 L0,3 z" fill="#e74c3c"/></marker>
  </defs>

  <!-- Step annotations on left -->
  <text x="10" y="82" font-family="monospace" font-size="9" fill="#4a90e2">① code_verifier + code_challenge</text>

  <!-- ① → Auth server: authz request -->
  <line x1="75" y1="95" x2="340" y2="95" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="207" y="91" text-anchor="middle" font-family="monospace" font-size="9" fill="#333">GET /authorize?code_challenge=…</text>

  <!-- IdP: login + MFA box -->
  <rect x="280" y="104" width="140" height="22" rx="4" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
  <text x="350" y="119" text-anchor="middle" font-family="monospace" font-size="9" fill="#333">User login + MFA challenge</text>

  <!-- ② ← Auth server: redirect with code -->
  <line x1="340" y1="135" x2="85" y2="135" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="207" y="131" text-anchor="middle" font-family="monospace" font-size="9" fill="#333">302 redirect + auth_code</text>

  <!-- ③ → Auth server: token exchange -->
  <line x1="75" y1="158" x2="340" y2="158" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="207" y="154" text-anchor="middle" font-family="monospace" font-size="9" fill="#333">POST /token  auth_code + code_verifier</text>

  <!-- ④ ← Auth server: tokens -->
  <line x1="340" y1="181" x2="85" y2="181" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="207" y="177" text-anchor="middle" font-family="monospace" font-size="9" fill="#333">access_token (JWT) + refresh_token</text>

  <!-- Storage note -->
  <rect x="10" y="190" width="200" height="22" rx="4" fill="#e8f5e9" stroke="#43a047" stroke-width="1"/>
  <text x="110" y="204" text-anchor="middle" font-family="monospace" font-size="9" fill="#333">AT → JS memory | RT → HttpOnly cookie</text>

  <!-- ⑤ → API: bearer token -->
  <line x1="75" y1="232" x2="615" y2="232" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="350" y="228" text-anchor="middle" font-family="monospace" font-size="9" fill="#333">GET /api/data  Authorization: Bearer &lt;AT&gt;</text>

  <!-- ⑥ ← API: 200 response -->
  <line x1="615" y1="252" x2="85" y2="252" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="350" y="248" text-anchor="middle" font-family="monospace" font-size="9" fill="#333">200 OK — protected resource</text>

  <!-- ⑦ AT expired, silent refresh -->
  <rect x="10" y="268" width="200" height="22" rx="4" fill="#fce4ec" stroke="#e91e63" stroke-width="1"/>
  <text x="110" y="282" text-anchor="middle" font-family="monospace" font-size="9" fill="#c62828">AT expired → silent refresh via RT cookie</text>

  <!-- ⑦ → Auth: refresh -->
  <line x1="75" y1="302" x2="340" y2="302" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a3)"/>
  <text x="207" y="298" text-anchor="middle" font-family="monospace" font-size="9" fill="#c62828">POST /token  grant=refresh_token (cookie)</text>

  <!-- ⑦ ← Auth: new tokens (rotated) -->
  <line x1="340" y1="322" x2="85" y2="322" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a4)"/>
  <text x="207" y="318" text-anchor="middle" font-family="monospace" font-size="9" fill="#c62828">new AT + rotated RT (new HttpOnly cookie)</text>

  <!-- replay queued requests -->
  <line x1="75" y1="348" x2="615" y2="348" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="350" y="344" text-anchor="middle" font-family="monospace" font-size="9" fill="#333">retry queued requests with new AT</text>
</svg>