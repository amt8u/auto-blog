<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300">
  <rect width="700" height="300" fill="white"/>
  <text x="350" y="30" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333333" font-weight="bold">Where TLS actually sits</text>
  <rect x="200" y="55" width="300" height="45" fill="#f0f4f8" stroke="#333333"/>
  <text x="350" y="83" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333333">Application (HTTP, SMTP, gRPC)</text>
  <rect x="200" y="110" width="300" height="45" fill="#4a90e2" stroke="#333333"/>
  <text x="350" y="138" text-anchor="middle" font-family="sans-serif" font-size="15" fill="white" font-weight="bold">TLS  (encryption / handshake)</text>
  <rect x="200" y="165" width="300" height="45" fill="#f0f4f8" stroke="#333333"/>
  <text x="350" y="193" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333333">TCP  (transport — layer 4)</text>
  <rect x="200" y="220" width="300" height="45" fill="#f0f4f8" stroke="#333333"/>
  <text x="350" y="248" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333333">IP  (network — layer 3)</text>
  <text x="540" y="138" font-family="sans-serif" font-size="13" fill="#4a90e2">← not really</text>
  <text x="540" y="153" font-family="sans-serif" font-size="13" fill="#4a90e2">  "transport"</text>
</svg>