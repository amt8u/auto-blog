<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340">
  <rect width="700" height="340" fill="white"/>
  <text x="350" y="28" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333333" font-weight="bold">Three ways to handle TLS at a proxy</text>

  <!-- Termination -->
  <text x="20" y="70" font-family="sans-serif" font-size="14" fill="#333333" font-weight="bold">Termination</text>
  <rect x="150" y="52" width="90" height="36" fill="#f0f4f8" stroke="#333333"/>
  <text x="195" y="75" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333333">Client</text>
  <rect x="330" y="52" width="90" height="36" fill="#4a90e2" stroke="#333333"/>
  <text x="375" y="75" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white">Proxy</text>
  <rect x="520" y="52" width="90" height="36" fill="#f0f4f8" stroke="#333333"/>
  <text x="565" y="75" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333333">Backend</text>
  <line x1="240" y1="70" x2="330" y2="70" stroke="#4a90e2" stroke-width="3"/>
  <text x="285" y="64" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4a90e2">TLS</text>
  <line x1="420" y1="70" x2="520" y2="70" stroke="#333333" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="470" y="64" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#333333">HTTP</text>

  <!-- Passthrough -->
  <text x="20" y="170" font-family="sans-serif" font-size="14" fill="#333333" font-weight="bold">Passthrough</text>
  <rect x="150" y="152" width="90" height="36" fill="#f0f4f8" stroke="#333333"/>
  <text x="195" y="175" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333333">Client</text>
  <rect x="330" y="152" width="90" height="36" fill="#f0f4f8" stroke="#333333"/>
  <text x="375" y="175" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333333">Proxy</text>
  <rect x="520" y="152" width="90" height="36" fill="#4a90e2" stroke="#333333"/>
  <text x="565" y="175" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white">Backend</text>
  <line x1="240" y1="170" x2="520" y2="170" stroke="#4a90e2" stroke-width="3"/>
  <text x="380" y="164" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4a90e2">TLS all the way (proxy just forwards)</text>

  <!-- Re-encryption -->
  <text x="20" y="270" font-family="sans-serif" font-size="14" fill="#333333" font-weight="bold">Re-encrypt</text>
  <rect x="150" y="252" width="90" height="36" fill="#f0f4f8" stroke="#333333"/>
  <text x="195" y="275" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333333">Client</text>
  <rect x="330" y="252" width="90" height="36" fill="#4a90e2" stroke="#333333"/>
  <text x="375" y="275" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white">Proxy</text>
  <rect x="520" y="252" width="90" height="36" fill="#4a90e2" stroke="#333333"/>
  <text x="565" y="275" text-anchor="middle" font-family="sans-serif" font-size="12" fill="white">Backend</text>
  <line x1="240" y1="270" x2="330" y2="270" stroke="#4a90e2" stroke-width="3"/>
  <text x="285" y="264" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4a90e2">TLS</text>
  <line x1="420" y1="270" x2="520" y2="270" stroke="#4a90e2" stroke-width="3"/>
  <text x="470" y="264" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4a90e2">new TLS</text>
</svg>