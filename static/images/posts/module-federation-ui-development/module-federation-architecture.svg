<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360">
  <rect width="700" height="360" fill="white"/>

  <!-- Host App box -->
  <rect x="30" y="40" width="200" height="100" rx="8" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="130" y="75" text-anchor="middle" font-family="monospace" font-size="13" fill="#333333" font-weight="bold">Host App (Shell)</text>
  <text x="130" y="97" text-anchor="middle" font-family="monospace" font-size="11" fill="#666666">Fetches remoteEntry.js</text>
  <text x="130" y="115" text-anchor="middle" font-family="monospace" font-size="11" fill="#666666">Loads modules at runtime</text>

  <!-- Remote A -->
  <rect x="450" y="30" width="210" height="85" rx="8" fill="#f0f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="555" y="60" text-anchor="middle" font-family="monospace" font-size="13" fill="#333333" font-weight="bold">Remote A</text>
  <text x="555" y="80" text-anchor="middle" font-family="monospace" font-size="11" fill="#666666">Exposes: &lt;Header /&gt;</text>
  <text x="555" y="97" text-anchor="middle" font-family="monospace" font-size="11" fill="#666666">Exposes: &lt;NavMenu /&gt;</text>

  <!-- Remote B -->
  <rect x="450" y="145" width="210" height="85" rx="8" fill="#f0f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="555" y="175" text-anchor="middle" font-family="monospace" font-size="13" fill="#333333" font-weight="bold">Remote B</text>
  <text x="555" y="195" text-anchor="middle" font-family="monospace" font-size="11" fill="#666666">Exposes: &lt;Dashboard /&gt;</text>
  <text x="555" y="212" text-anchor="middle" font-family="monospace" font-size="11" fill="#666666">Exposes: &lt;Charts /&gt;</text>

  <!-- Remote C -->
  <rect x="450" y="260" width="210" height="75" rx="8" fill="#f0f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="555" y="290" text-anchor="middle" font-family="monospace" font-size="13" fill="#333333" font-weight="bold">Remote C</text>
  <text x="555" y="312" text-anchor="middle" font-family="monospace" font-size="11" fill="#666666">Exposes: &lt;Checkout /&gt;</text>

  <!-- Shared Scope box -->
  <rect x="155" y="230" width="230" height="80" rx="8" fill="#fffbea" stroke="#f0a500" stroke-width="1.5"/>
  <text x="270" y="257" text-anchor="middle" font-family="monospace" font-size="12" fill="#333333" font-weight="bold">Shared Scope (singleton)</text>
  <text x="270" y="277" text-anchor="middle" font-family="monospace" font-size="11" fill="#666666">react, react-dom</text>
  <text x="270" y="294" text-anchor="middle" font-family="monospace" font-size="11" fill="#666666">design-system, shared-utils</text>

  <!-- Arrows Host to Remotes -->
  <line x1="232" y1="70" x2="447" y2="70" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="232" y1="85" x2="447" y2="185" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="232" y1="100" x2="447" y2="292" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Dashed arrow Host to Shared -->
  <line x1="130" y1="142" x2="215" y2="228" stroke="#f0a500" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowOrange)"/>

  <!-- Runtime label -->
  <text x="330" y="58" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4a90e2">loads at runtime</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4a90e2"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f0a500"/>
    </marker>
  </defs>
</svg>