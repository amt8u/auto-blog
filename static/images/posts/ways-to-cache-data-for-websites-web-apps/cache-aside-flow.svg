<svg xmlns="http://www.w3.org/2000/svg" width="700" height="240" viewBox="0 0 700 240">
  <rect width="700" height="240" fill="white"/>
  <text x="350" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#333333" text-anchor="middle">Cache-aside (lazy loading)</text>
  <rect x="30" y="90" width="120" height="50" rx="4" fill="#f0f4f8" stroke="#333333"/>
  <text x="90" y="120" font-family="sans-serif" font-size="13" fill="#333333" text-anchor="middle">App</text>
  <rect x="290" y="90" width="120" height="50" rx="4" fill="#f0f4f8" stroke="#333333"/>
  <text x="350" y="120" font-family="sans-serif" font-size="13" fill="#333333" text-anchor="middle">Cache</text>
  <rect x="550" y="90" width="120" height="50" rx="4" fill="#4a90e2" stroke="#333333"/>
  <text x="610" y="120" font-family="sans-serif" font-size="13" fill="white" text-anchor="middle">Database</text>
  <line x1="150" y1="105" x2="285" y2="105" stroke="#4a90e2" stroke-width="2"/>
  <polygon points="285,105 275,101 275,109" fill="#4a90e2"/>
  <text x="217" y="98" font-family="sans-serif" font-size="11" fill="#333333" text-anchor="middle">1. read</text>
  <line x1="285" y1="128" x2="150" y2="128" stroke="#333333" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="150,128 160,124 160,132" fill="#333333"/>
  <text x="217" y="145" font-family="sans-serif" font-size="11" fill="#333333" text-anchor="middle">2. miss</text>
  <line x1="410" y1="105" x2="545" y2="105" stroke="#4a90e2" stroke-width="2"/>
  <polygon points="545,105 535,101 535,109" fill="#4a90e2"/>
  <text x="477" y="98" font-family="sans-serif" font-size="11" fill="#333333" text-anchor="middle">3. query</text>
  <line x1="545" y1="128" x2="410" y2="128" stroke="#333333" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="410,128 420,124 420,132" fill="#333333"/>
  <text x="477" y="145" font-family="sans-serif" font-size="11" fill="#333333" text-anchor="middle">4. populate</text>
  <text x="350" y="205" font-family="sans-serif" font-size="12" fill="#333333" text-anchor="middle">Next read for the same key hits the cache and skips steps 3–4.</text>
</svg>