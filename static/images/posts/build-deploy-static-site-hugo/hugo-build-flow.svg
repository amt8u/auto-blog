<svg xmlns="http://www.w3.org/2000/svg" width="700" height="200" viewBox="0 0 700 200">
  <rect width="700" height="200" fill="white"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Markdown + Theme -->
  <rect x="15" y="70" width="140" height="60" rx="8" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="85" y="97" font-family="monospace" font-size="13" text-anchor="middle" fill="#333333">Markdown</text>
  <text x="85" y="115" font-family="monospace" font-size="11" text-anchor="middle" fill="#333333">+ Theme</text>
  <!-- Arrow 1 -->
  <line x1="155" y1="100" x2="205" y2="100" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Hugo build -->
  <rect x="205" y="70" width="145" height="60" rx="8" fill="#4a90e2" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="278" y="97" font-family="monospace" font-size="13" text-anchor="middle" fill="white">hugo build</text>
  <text x="278" y="115" font-family="monospace" font-size="11" text-anchor="middle" fill="white">&lt; 1 second</text>
  <!-- Arrow 2 -->
  <line x1="350" y1="100" x2="400" y2="100" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Static files -->
  <rect x="400" y="70" width="140" height="60" rx="8" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="470" y="97" font-family="monospace" font-size="13" text-anchor="middle" fill="#333333">Static Files</text>
  <text x="470" y="115" font-family="monospace" font-size="11" text-anchor="middle" fill="#333333">HTML / CSS / JS</text>
  <!-- Arrow 3 -->
  <line x1="540" y1="100" x2="590" y2="100" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- CDN -->
  <rect x="590" y="70" width="95" height="60" rx="8" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="638" y="97" font-family="monospace" font-size="12" text-anchor="middle" fill="#333333">CDN /</text>
  <text x="638" y="114" font-family="monospace" font-size="12" text-anchor="middle" fill="#333333">Hosting</text>
</svg>