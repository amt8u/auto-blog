<svg xmlns="http://www.w3.org/2000/svg" width="700" height="220" viewBox="0 0 700 220">
  <!-- Background -->
  <rect width="700" height="220" fill="white"/>
  <!-- iPhone -->
  <rect x="30" y="75" width="110" height="70" rx="10" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="85" y="115" font-family="sans-serif" font-size="13" fill="#333333" text-anchor="middle">iPhone</text>
  <!-- iPad -->
  <rect x="185" y="55" width="110" height="90" rx="10" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="240" y="105" font-family="sans-serif" font-size="13" fill="#333333" text-anchor="middle">iPad</text>
  <!-- Mac -->
  <rect x="340" y="65" width="110" height="70" rx="10" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="395" y="105" font-family="sans-serif" font-size="13" fill="#333333" text-anchor="middle">Mac</text>
  <!-- Apple Watch -->
  <rect x="495" y="75" width="110" height="70" rx="10" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="550" y="108" font-family="sans-serif" font-size="13" fill="#333333" text-anchor="middle">Apple</text>
  <text x="550" y="126" font-family="sans-serif" font-size="13" fill="#333333" text-anchor="middle">Watch</text>
  <!-- Arrows between all nodes -->
  <line x1="140" y1="110" x2="185" y2="105" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="295" y1="102" x2="340" y2="100" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="100" x2="495" y2="105" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Labels -->
  <text x="162" y="95" font-family="sans-serif" font-size="10" fill="#4a90e2" text-anchor="middle">Handoff</text>
  <text x="318" y="92" font-family="sans-serif" font-size="10" fill="#4a90e2" text-anchor="middle">AirDrop</text>
  <text x="473" y="95" font-family="sans-serif" font-size="10" fill="#4a90e2" text-anchor="middle">Sync</text>
  <!-- Bottom label -->
  <text x="350" y="195" font-family="sans-serif" font-size="12" fill="#333333" text-anchor="middle" font-style="italic">Seamless Apple Ecosystem — all devices work as one</text>
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4a90e2"/>
    </marker>
  </defs>
</svg>