<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320">
  <rect width="700" height="320" fill="#ffffff"/>
  <text x="350" y="22" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333333">From Bell Labs to your terminal: a rough command timeline</text>

  <!-- main timeline line -->
  <line x1="40" y1="160" x2="660" y2="160" stroke="#4a90e2" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4a90e2"/>
    </marker>
  </defs>

  <!-- node 1: 1969 -->
  <circle cx="75" cy="160" r="5" fill="#4a90e2"/>
  <line x1="75" y1="155" x2="75" y2="115" stroke="#333333" stroke-width="1"/>
  <rect x="10" y="50" width="130" height="65" rx="6" fill="#f0f4f8" stroke="#333333"/>
  <text x="75" y="70" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333333">1969</text>
  <text x="75" y="88" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">Unix project begins</text>
  <text x="75" y="102" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">Thompson &amp; Ritchie</text>

  <!-- node 2: 1971-72 -->
  <circle cx="220" cy="160" r="5" fill="#4a90e2"/>
  <line x1="220" y1="165" x2="220" y2="205" stroke="#333333" stroke-width="1"/>
  <rect x="135" y="205" width="170" height="80" rx="6" fill="#f0f4f8" stroke="#333333"/>
  <text x="220" y="225" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333333">1971-72</text>
  <text x="220" y="243" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">ls, cat, cp, mv, rm,</text>
  <text x="220" y="259" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">chmod, find, ps</text>
  <text x="220" y="275" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">ship in v1 / v2</text>

  <!-- node 3: 1973 -->
  <circle cx="370" cy="160" r="5" fill="#4a90e2"/>
  <line x1="370" y1="155" x2="370" y2="115" stroke="#333333" stroke-width="1"/>
  <rect x="295" y="50" width="150" height="65" rx="6" fill="#f0f4f8" stroke="#333333"/>
  <text x="370" y="70" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333333">1973</text>
  <text x="370" y="88" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">grep &amp; sed arrive;</text>
  <text x="370" y="102" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">pipes ( | ) connect them</text>

  <!-- node 4: 1974 -->
  <circle cx="490" cy="160" r="5" fill="#4a90e2"/>
  <line x1="490" y1="165" x2="490" y2="205" stroke="#333333" stroke-width="1"/>
  <rect x="420" y="205" width="140" height="55" rx="6" fill="#f0f4f8" stroke="#333333"/>
  <text x="490" y="227" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333333">1974</text>
  <text x="490" y="245" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">pwd added for navigation</text>

  <!-- node 5: 1977 -->
  <circle cx="615" cy="160" r="5" fill="#4a90e2"/>
  <line x1="615" y1="155" x2="615" y2="115" stroke="#333333" stroke-width="1"/>
  <rect x="540" y="50" width="140" height="65" rx="6" fill="#f0f4f8" stroke="#333333"/>
  <text x="615" y="70" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333333">1977</text>
  <text x="615" y="88" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">awk brings a tiny</text>
  <text x="615" y="102" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">text-processing language</text>
</svg>