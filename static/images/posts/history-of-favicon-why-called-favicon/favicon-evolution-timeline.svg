<svg xmlns="http://www.w3.org/2000/svg" width="700" height="220" viewBox="0 0 700 220">
  <!-- Background -->
  <rect width="700" height="220" fill="white"/>
  <!-- Timeline line -->
  <line x1="40" y1="110" x2="660" y2="110" stroke="#4a90e2" stroke-width="2"/>
  <!-- Dot 1: 1999 -->
  <circle cx="80" cy="110" r="8" fill="#4a90e2"/>
  <text x="80" y="95" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333333" font-weight="bold">1999</text>
  <text x="80" y="135" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">IE5 — Favorites</text>
  <text x="80" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">list only</text>
  <!-- Dot 2: 1999 Dec -->
  <circle cx="210" cy="110" r="8" fill="#4a90e2"/>
  <text x="210" y="95" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333333" font-weight="bold">Dec 1999</text>
  <text x="210" y="135" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">W3C HTML 4.01</text>
  <text x="210" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">standardised</text>
  <!-- Dot 3: 2002-2004 -->
  <circle cx="360" cy="110" r="8" fill="#4a90e2"/>
  <text x="360" y="95" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333333" font-weight="bold">2002–04</text>
  <text x="360" y="135" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">Firefox, Opera,</text>
  <text x="360" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">Safari → Tabs</text>
  <!-- Dot 4: 2007 -->
  <circle cx="500" cy="110" r="8" fill="#4a90e2"/>
  <text x="500" y="95" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333333" font-weight="bold">2007</text>
  <text x="500" y="135" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">Apple Touch Icon</text>
  <text x="500" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">iPhone home screen</text>
  <!-- Dot 5: Now -->
  <circle cx="640" cy="110" r="8" fill="#4a90e2"/>
  <text x="640" y="95" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333333" font-weight="bold">Today</text>
  <text x="640" y="135" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">SVG, PWA</text>
  <text x="640" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">manifests</text>
</svg>