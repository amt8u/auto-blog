<svg xmlns="http://www.w3.org/2000/svg" width="700" height="295" viewBox="0 0 700 295">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a90e2"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e74c3c"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
  </defs>
  <rect width="700" height="295" fill="white"/>
  <!-- Title -->
  <text x="350" y="28" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#333333" font-weight="bold">Redis Caching Flow</text>
  <text x="350" y="48" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#888">A cache hit never reaches the database</text>
  <!-- CLIENT box -->
  <rect x="22" y="112" width="120" height="60" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="82" y="139" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#333333" font-weight="bold">Client</text>
  <text x="82" y="157" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#666">web / app</text>
  <!-- REDIS box -->
  <rect x="258" y="102" width="144" height="80" rx="6" fill="#f0f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="330" y="132" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#333333" font-weight="bold">Redis</text>
  <text x="330" y="150" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#666">in-memory store</text>
  <text x="330" y="168" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#4a90e2">~0.17 ms latency</text>
  <!-- DATABASE box -->
  <rect x="516" y="112" width="148" height="60" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="590" y="139" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#333333" font-weight="bold">Database</text>
  <text x="590" y="157" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#999">Postgres / MySQL  10–200ms</text>
  <!-- Arrow: Client → Redis -->
  <line x1="142" y1="134" x2="256" y2="134" stroke="#4a90e2" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="199" y="124" font-family="monospace" font-size="11" text-anchor="middle" fill="#4a90e2">GET key</text>
  <!-- Cache HIT arc: Redis → Client over the top -->
  <path d="M 259 110 Q 199 58 143 110" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>
  <text x="199" y="72" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#27ae60" font-weight="bold">Cache HIT</text>
  <text x="199" y="88" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#27ae60">returns instantly</text>
  <!-- Cache MISS: Redis → DB dashed -->
  <line x1="402" y1="142" x2="514" y2="142" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <text x="458" y="132" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#e74c3c">Cache MISS</text>
  <!-- Write-back: DB → Redis arc below -->
  <path d="M 516 166 Q 458 228 403 166" stroke="#555" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>
  <text x="459" y="220" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#555">write result to cache</text>
  <!-- Footer -->
  <text x="350" y="270" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#aaa">On miss: DB result fetched, stored in Redis with TTL, returned to client.</text>
</svg>