<svg xmlns="http://www.w3.org/2000/svg" width="700" height="260" viewBox="0 0 700 260">
  <rect width="700" height="260" fill="white"/>

  <!-- Host box -->
  <rect x="20" y="50" width="155" height="170" rx="8" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="97" y="38" font-family="sans-serif" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">Host (e.g. Claude Desktop)</text>

  <!-- LLM chip -->
  <rect x="37" y="68" width="120" height="44" rx="5" fill="#4a90e2"/>
  <text x="97" y="94" font-family="sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">LLM</text>

  <!-- Down arrow LLM → Client -->
  <line x1="97" y1="112" x2="97" y2="136" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- MCP Client chip -->
  <rect x="37" y="136" width="120" height="44" rx="5" fill="#4a90e2"/>
  <text x="97" y="162" font-family="sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">MCP Client</text>

  <!-- JSON-RPC arrows to servers -->
  <line x1="175" y1="158" x2="265" y2="100" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrBlue)"/>
  <line x1="175" y1="162" x2="265" y2="185" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrBlue)"/>

  <text x="222" y="118" font-family="sans-serif" font-size="10" fill="#4a90e2" text-anchor="middle" transform="rotate(-22,222,118)">JSON-RPC 2.0</text>

  <!-- Server 1 -->
  <rect x="265" y="62" width="145" height="72" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="337" y="91" font-family="sans-serif" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">MCP Server</text>
  <text x="337" y="109" font-family="sans-serif" font-size="10" fill="#666666" text-anchor="middle">GitHub / Jira / Slack</text>

  <!-- Server 2 -->
  <rect x="265" y="152" width="145" height="72" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="337" y="181" font-family="sans-serif" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">MCP Server</text>
  <text x="337" y="199" font-family="sans-serif" font-size="10" fill="#666666" text-anchor="middle">DB / Files / Custom API</text>

  <!-- Arrows to external -->
  <line x1="410" y1="98" x2="490" y2="98" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="410" y1="188" x2="490" y2="188" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- External system 1 -->
  <rect x="490" y="68" width="185" height="60" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="582" y="93" font-family="sans-serif" font-size="11" fill="#333333" text-anchor="middle">REST / GraphQL API</text>
  <text x="582" y="112" font-family="sans-serif" font-size="10" fill="#888888" text-anchor="middle">(OpenAPI spec lives here)</text>

  <!-- External system 2 -->
  <rect x="490" y="158" width="185" height="60" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="582" y="183" font-family="sans-serif" font-size="11" fill="#333333" text-anchor="middle">Any Data Source</text>
  <text x="582" y="202" font-family="sans-serif" font-size="10" fill="#888888" text-anchor="middle">(Postgres, S3, local fs…)</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#333333"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4a90e2"/>
    </marker>
  </defs>
</svg>