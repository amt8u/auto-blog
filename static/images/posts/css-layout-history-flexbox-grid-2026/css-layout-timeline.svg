<svg xmlns="http://www.w3.org/2000/svg" width="700" height="220" viewBox="0 0 700 220">
  <!-- Background -->
  <rect width="700" height="220" fill="white"/>
  <!-- Timeline axis -->
  <line x1="40" y1="110" x2="670" y2="110" stroke="#333333" stroke-width="2"/>
  <!-- Arrow -->
  <polygon points="670,104 670,116 682,110" fill="#333333"/>
  <!-- Era blocks -->
  <!-- Tables -->
  <rect x="50" y="75" width="110" height="50" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="105" y="96" text-anchor="middle" font-family="monospace" font-size="11" fill="#333333">Tables</text>
  <text x="105" y="112" text-anchor="middle" font-family="monospace" font-size="10" fill="#4a90e2">1994–2004</text>
  <!-- Floats -->
  <rect x="175" y="75" width="110" height="50" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="230" y="96" text-anchor="middle" font-family="monospace" font-size="11" fill="#333333">Floats</text>
  <text x="230" y="112" text-anchor="middle" font-family="monospace" font-size="10" fill="#4a90e2">2002–2013</text>
  <!-- Flexbox -->
  <rect x="300" y="75" width="110" height="50" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="355" y="96" text-anchor="middle" font-family="monospace" font-size="11" fill="#333333">Flexbox</text>
  <text x="355" y="112" text-anchor="middle" font-family="monospace" font-size="10" fill="#4a90e2">2012–now</text>
  <!-- Grid -->
  <rect x="425" y="75" width="110" height="50" rx="6" fill="#4a90e2" stroke="#333333" stroke-width="1.5"/>
  <text x="480" y="96" text-anchor="middle" font-family="monospace" font-size="11" fill="white">CSS Grid</text>
  <text x="480" y="112" text-anchor="middle" font-family="monospace" font-size="10" fill="white">2017–now</text>
  <!-- Subgrid/CQ -->
  <rect x="550" y="75" width="110" height="50" rx="6" fill="#4a90e2" stroke="#333333" stroke-width="1.5"/>
  <text x="605" y="91" text-anchor="middle" font-family="monospace" font-size="10" fill="white">Subgrid +</text>
  <text x="605" y="105" text-anchor="middle" font-family="monospace" font-size="10" fill="white">Container Q.</text>
  <text x="605" y="119" text-anchor="middle" font-family="monospace" font-size="9" fill="white">2023–now</text>
  <!-- Year labels on axis -->
  <text x="50" y="145" font-family="monospace" font-size="10" fill="#333333">1994</text>
  <text x="300" y="145" font-family="monospace" font-size="10" fill="#333333">2012</text>
  <text x="425" y="145" font-family="monospace" font-size="10" fill="#333333">2017</text>
  <text x="550" y="145" font-family="monospace" font-size="10" fill="#333333">2023</text>
  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333333">CSS Layout Evolution</text>
</svg>