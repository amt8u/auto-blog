<svg xmlns="http://www.w3.org/2000/svg" width="700" height="430" viewBox="0 0 700 430">
  <rect width="700" height="430" fill="#ffffff"/>
  <text x="350" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#333333">From a State Update to Pixels on Screen</text>

  <!-- Step 1 -->
  <rect x="220" y="50" width="260" height="46" rx="6" fill="#f0f4f8" stroke="#333333"/>
  <text x="350" y="78" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333333">1. setState() schedules an update</text>

  <line x1="350" y1="96" x2="350" y2="116" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="190" y="120" width="320" height="46" rx="6" fill="#f0f4f8" stroke="#333333"/>
  <text x="350" y="148" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333333">2. Scheduler assigns a priority (lane)</text>

  <line x1="350" y1="166" x2="350" y2="186" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="150" y="190" width="400" height="60" rx="6" fill="#f0f4f8" stroke="#333333" stroke-dasharray="5,4"/>
  <text x="350" y="215" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333333">3. Render Phase — build workInProgress fiber tree</text>
  <text x="350" y="235" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">(pure, interruptible — can pause and yield to browser)</text>

  <!-- Interrupt loop -->
  <path d="M 550 220 C 640 220, 640 150, 550 145" fill="none" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="185" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333" transform="rotate(90 660 185)">urgent update interrupts</text>

  <line x1="350" y1="250" x2="350" y2="270" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <rect x="170" y="274" width="360" height="50" rx="6" fill="#f0f4f8" stroke="#333333"/>
  <text x="350" y="298" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333333">4. Commit Phase — mutate real DOM, run effects</text>
  <text x="350" y="315" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">(synchronous — runs to completion)</text>

  <line x1="350" y1="324" x2="350" y2="344" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5 -->
  <rect x="240" y="348" width="220" height="46" rx="6" fill="#f0f4f8" stroke="#333333"/>
  <text x="350" y="376" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333333">5. Browser paints the screen</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a90e2"/>
    </marker>
  </defs>
</svg>