<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340">
  <rect width="700" height="340" fill="white"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4a90e2"/>
    </marker>
    <marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#333333"/>
    </marker>
  </defs>
  <text x="350" y="25" text-anchor="middle" font-family="monospace" font-size="14" fill="#333333" font-weight="bold">Redis Internal Architecture</text>
  <rect x="20" y="45" width="100" height="36" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="70" y="68" text-anchor="middle" font-family="monospace" font-size="12" fill="#333333">Client 1</text>
  <rect x="20" y="100" width="100" height="36" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="70" y="123" text-anchor="middle" font-family="monospace" font-size="12" fill="#333333">Client 2</text>
  <rect x="20" y="155" width="100" height="36" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="70" y="178" text-anchor="middle" font-family="monospace" font-size="12" fill="#333333">Client N</text>
  <line x1="120" y1="63" x2="183" y2="120" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="118" x2="183" y2="128" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="173" x2="183" y2="140" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="137" y="102" text-anchor="middle" font-family="monospace" font-size="10" fill="#4a90e2">RESP</text>
  <rect x="185" y="95" width="140" height="80" rx="6" fill="#4a90e2" stroke="#333333" stroke-width="1.5"/>
  <text x="255" y="125" text-anchor="middle" font-family="monospace" font-size="13" fill="white" font-weight="bold">Event Loop</text>
  <text x="255" y="145" text-anchor="middle" font-family="monospace" font-size="11" fill="white">(ae / epoll)</text>
  <text x="255" y="163" text-anchor="middle" font-family="monospace" font-size="10" fill="white">single thread</text>
  <line x1="325" y1="135" x2="388" y2="135" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="390" y="95" width="130" height="80" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="455" y="125" text-anchor="middle" font-family="monospace" font-size="12" fill="#333333">Command</text>
  <text x="455" y="143" text-anchor="middle" font-family="monospace" font-size="12" fill="#333333">Dispatcher</text>
  <text x="455" y="162" text-anchor="middle" font-family="monospace" font-size="10" fill="#333333">server.commands</text>
  <line x1="520" y1="112" x2="583" y2="65" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="135" x2="583" y2="135" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="158" x2="583" y2="205" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="585" y="42" width="100" height="36" rx="4" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="635" y="65" text-anchor="middle" font-family="monospace" font-size="11" fill="#333333">dict (hash)</text>
  <rect x="585" y="117" width="100" height="36" rx="4" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="635" y="140" text-anchor="middle" font-family="monospace" font-size="11" fill="#333333">skiplist</text>
  <rect x="585" y="192" width="100" height="36" rx="4" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/>
  <text x="635" y="215" text-anchor="middle" font-family="monospace" font-size="11" fill="#333333">quicklist</text>
  <rect x="185" y="265" width="340" height="50" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="355" y="286" text-anchor="middle" font-family="monospace" font-size="12" fill="#333333">Persistence: RDB (fork+snapshot) / AOF (write log)</text>
  <text x="355" y="304" text-anchor="middle" font-family="monospace" font-size="10" fill="#333333">runs in background child process</text>
  <line x1="255" y1="175" x2="280" y2="263" stroke="#333333" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-dark)"/>
</svg>