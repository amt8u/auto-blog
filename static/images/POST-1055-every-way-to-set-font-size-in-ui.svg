<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f3ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e3fcf3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fde68a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f1f5f9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#94a3b8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fdba74;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="stageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3730a3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="floorFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c7d2fe;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#c7d2fe;stop-opacity:0.35" />
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fef9c3;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#fef9c3;stop-opacity:0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 40 L40 40 L40 0" fill="none" stroke="#c7d2fe" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Soft violet-to-mint canvas with a faint UI grid -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1130" cy="60" r="170" fill="#bae6fd" opacity="0.35"/>
  <circle cx="55" cy="610" r="150" fill="#fbcfe8" opacity="0.25"/>
  <rect x="0" y="480" width="1200" height="150" fill="url(#floorFade)"/>

  <!-- Spotlight on the winners' podium -->
  <ellipse cx="710" cy="250" rx="260" ry="320" fill="url(#spotlight)"/>

  <!-- THE FIELD: every unit that can size text -->
  <text x="54" y="76" font-size="14" font-weight="700" letter-spacing="4" fill="#6366f1" font-family="IBM Plex Mono, monospace">THE FIELD</text>

  <!-- Contender: px -->
  <g font-family="IBM Plex Mono, monospace">
    <rect x="50" y="92" width="300" height="78" rx="16" fill="#ffffff" fill-opacity="0.7" stroke="#c7d2fe" stroke-width="1.5"/>
    <circle cx="92" cy="131" r="26" fill="#fee2e2"/>
    <g transform="translate(92,131)">
      <path d="M-5,-3 a5,5 0 0 1 10,0" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="-8" y="-3" width="16" height="12" rx="2" fill="#dc2626"/>
      <circle cx="0" cy="3" r="1.5" fill="#fee2e2"/>
    </g>
    <text x="140" y="141" font-size="28" font-weight="700" fill="#1e293b">px</text>
    <rect x="268" y="117" width="66" height="28" rx="14" fill="#fee2e2"/>
    <text x="301" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">fixed</text>
  </g>

  <!-- Contender: pt -->
  <g font-family="IBM Plex Mono, monospace">
    <rect x="50" y="184" width="300" height="78" rx="16" fill="#ffffff" fill-opacity="0.7" stroke="#c7d2fe" stroke-width="1.5"/>
    <circle cx="92" cy="223" r="26" fill="#e2e8f0"/>
    <g transform="translate(92,223) rotate(-25)">
      <rect x="-14" y="-4" width="28" height="8" rx="1.5" fill="#94a3b8"/>
      <line x1="-8" y1="-4" x2="-8" y2="0" stroke="#475569" stroke-width="1.5"/>
      <line x1="-2" y1="-4" x2="-2" y2="1" stroke="#475569" stroke-width="1.5"/>
      <line x1="4" y1="-4" x2="4" y2="0" stroke="#475569" stroke-width="1.5"/>
      <line x1="10" y1="-4" x2="10" y2="1" stroke="#475569" stroke-width="1.5"/>
    </g>
    <text x="140" y="233" font-size="28" font-weight="700" fill="#1e293b">pt</text>
    <rect x="262" y="209" width="74" height="28" rx="14" fill="#e2e8f0"/>
    <text x="299" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">print</text>
  </g>

  <!-- Contender: vw -->
  <g font-family="IBM Plex Mono, monospace">
    <rect x="50" y="276" width="300" height="78" rx="16" fill="#ffffff" fill-opacity="0.7" stroke="#c7d2fe" stroke-width="1.5"/>
    <circle cx="92" cy="315" r="26" fill="#dbeafe"/>
    <g transform="translate(92,315)">
      <rect x="-11" y="-9" width="22" height="14" rx="2" fill="none" stroke="#2563eb" stroke-width="2"/>
      <rect x="-8" y="-6" width="16" height="8" fill="#93c5fd"/>
      <rect x="-4" y="6" width="8" height="3" fill="#2563eb"/>
      <rect x="-7" y="9" width="14" height="2" rx="1" fill="#2563eb"/>
    </g>
    <text x="140" y="325" font-size="28" font-weight="700" fill="#1e293b">vw</text>
    <rect x="246" y="301" width="90" height="28" rx="14" fill="#dbeafe"/>
    <text x="291" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">viewport</text>
  </g>

  <!-- Contender: % -->
  <g font-family="IBM Plex Mono, monospace">
    <rect x="50" y="368" width="300" height="78" rx="16" fill="#ffffff" fill-opacity="0.7" stroke="#c7d2fe" stroke-width="1.5"/>
    <circle cx="92" cy="407" r="26" fill="#f3e8ff"/>
    <g transform="translate(92,407)">
      <line x1="-7" y1="7" x2="7" y2="-7" stroke="#9333ea" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="-7" cy="-7" r="3" fill="#9333ea"/>
      <circle cx="7" cy="7" r="3" fill="#9333ea"/>
    </g>
    <text x="140" y="417" font-size="28" font-weight="700" fill="#1e293b">%</text>
    <rect x="246" y="393" width="90" height="28" rx="14" fill="#f3e8ff"/>
    <text x="291" y="412" text-anchor="middle" font-size="12" font-weight="700" fill="#9333ea">relative</text>
  </g>

  <!-- Contender: cqw -->
  <g font-family="IBM Plex Mono, monospace">
    <rect x="50" y="460" width="300" height="78" rx="16" fill="#ffffff" fill-opacity="0.7" stroke="#c7d2fe" stroke-width="1.5"/>
    <circle cx="92" cy="499" r="26" fill="#ccfbf1"/>
    <g transform="translate(92,499)">
      <rect x="-10" y="-10" width="20" height="20" rx="4" fill="none" stroke="#0d9488" stroke-width="2"/>
      <rect x="-5" y="-5" width="10" height="10" rx="2" fill="#5eead4"/>
      <path d="M9,-14 L11,-10 L15,-9 L11,-7 L9,-3 L7,-7 L3,-9 L7,-10 Z" fill="#fbbf24"/>
    </g>
    <text x="140" y="509" font-size="28" font-weight="700" fill="#1e293b">cqw</text>
    <rect x="288" y="485" width="48" height="28" rx="14" fill="#ccfbf1"/>
    <text x="312" y="504" text-anchor="middle" font-size="13" font-weight="700" fill="#0d9488">new</text>
  </g>

  <!-- RESULTS ribbon over the podium -->
  <g font-family="IBM Plex Mono, monospace">
    <path d="M590,55 L590,89 L572,80 L572,64 Z" fill="#0f766e"/>
    <path d="M750,55 L750,89 L768,80 L768,64 Z" fill="#0f766e"/>
    <rect x="590" y="55" width="160" height="34" rx="4" fill="#0d9488"/>
    <text x="670" y="77" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="4" fill="#ffffff">RESULTS</text>
  </g>

  <!-- a11y badge: the winners respect user font-size settings -->
  <g font-family="IBM Plex Mono, monospace">
    <rect x="775" y="58" width="92" height="32" rx="16" fill="#0d9488"/>
    <circle cx="793" cy="74" r="11" fill="#ffffff"/>
    <path d="M788,74 L792,78 L799,69" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="838" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">a11y</text>
  </g>

  <!-- Confetti -->
  <g opacity="0.8">
    <circle cx="500" cy="35" r="4" fill="#fbbf24"/>
    <circle cx="960" cy="40" r="4" fill="#60a5fa"/>
    <circle cx="930" cy="110" r="3" fill="#34d399"/>
    <circle cx="540" cy="115" r="3" fill="#f472b6"/>
    <path d="M610,18 L613,25 L620,27 L613,29 L610,36 L607,29 L600,27 L607,25 Z" fill="#a78bfa"/>
  </g>

  <!-- Stage -->
  <rect x="420" y="486" width="580" height="40" rx="8" fill="url(#stageGrad)"/>
  <rect x="420" y="486" width="580" height="3" fill="#818cf8" opacity="0.6"/>

  <!-- Silver block: clamp() -->
  <rect x="445" y="320" width="160" height="166" rx="6" fill="url(#silverGrad)"/>
  <rect x="445" y="320" width="160" height="8" fill="#ffffff" opacity="0.4"/>
  <rect x="445" y="456" width="160" height="30" fill="#1e293b" opacity="0.08"/>
  <rect x="515" y="338" width="6" height="40" fill="#64748b" opacity="0.4"/>
  <rect x="531" y="338" width="6" height="40" fill="#64748b" opacity="0.4"/>
  <circle cx="525" cy="338" r="22" fill="url(#silverGrad)" stroke="#64748b" stroke-width="2"/>
  <text x="525" y="346" text-anchor="middle" font-size="22" font-weight="700" fill="#334155" font-family="IBM Plex Mono, monospace">2</text>
  <text x="525" y="430" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b" font-family="IBM Plex Mono, monospace">clamp()</text>

  <!-- Gold block: rem -->
  <rect x="620" y="250" width="180" height="236" rx="6" fill="url(#goldGrad)"/>
  <rect x="620" y="250" width="180" height="8" fill="#ffffff" opacity="0.4"/>
  <rect x="620" y="456" width="180" height="30" fill="#1e293b" opacity="0.08"/>
  <rect x="698" y="270" width="6" height="50" fill="#b45309" opacity="0.45"/>
  <rect x="716" y="270" width="6" height="50" fill="#b45309" opacity="0.45"/>
  <circle cx="710" cy="270" r="26" fill="url(#goldGrad)" stroke="#b45309" stroke-width="2"/>
  <text x="710" y="279" text-anchor="middle" font-size="28" font-weight="700" fill="#78350f" font-family="IBM Plex Mono, monospace">1</text>
  <text x="710" y="420" text-anchor="middle" font-size="34" font-weight="700" fill="#ffffff" font-family="IBM Plex Mono, monospace">rem</text>

  <!-- Bronze block: em -->
  <rect x="815" y="350" width="160" height="136" rx="6" fill="url(#bronzeGrad)"/>
  <rect x="815" y="350" width="160" height="8" fill="#ffffff" opacity="0.4"/>
  <rect x="815" y="456" width="160" height="30" fill="#1e293b" opacity="0.08"/>
  <rect x="885" y="368" width="6" height="40" fill="#9a3412" opacity="0.4"/>
  <rect x="901" y="368" width="6" height="40" fill="#9a3412" opacity="0.4"/>
  <circle cx="895" cy="368" r="22" fill="url(#bronzeGrad)" stroke="#9a3412" stroke-width="2"/>
  <text x="895" y="376" text-anchor="middle" font-size="22" font-weight="700" fill="#7c2d12" font-family="IBM Plex Mono, monospace">3</text>
  <text x="895" y="440" text-anchor="middle" font-size="34" font-weight="700" fill="#ffffff" font-family="IBM Plex Mono, monospace">em</text>

  <!-- Aa glyphs: the rendered scale each unit produces -->
  <text x="525" y="300" text-anchor="middle" font-size="92" font-weight="700" fill="#334155" font-family="Space Grotesk, -apple-system, BlinkMacSystemFont, sans-serif">Aa</text>
  <text x="710" y="235" text-anchor="middle" font-size="130" font-weight="700" fill="#1e1b4b" font-family="Space Grotesk, -apple-system, BlinkMacSystemFont, sans-serif">Aa</text>
  <text x="895" y="320" text-anchor="middle" font-size="76" font-weight="700" fill="#7c2d12" font-family="Space Grotesk, -apple-system, BlinkMacSystemFont, sans-serif">Aa</text>

  <!-- Post ID badge -->
  <rect x="40" y="550" width="160" height="50" rx="8" fill="#1e1b4b" opacity="0.92"/>
  <text x="120" y="581" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="1" font-family="IBM Plex Mono, monospace">POST-1055</text>

  <!-- cloudmato.com watermark -->
  <text x="1160" y="610" text-anchor="end" fill="#94a3b8" font-size="14" font-family="Nunito, sans-serif">cloudmato.com</text>
</svg>