<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdf6ec;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f3e7d3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8a4c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e85d3d;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Warm paper-like background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Faint dotted grid texture -->
  <g fill="#d8c6ab" opacity="0.5">
    <circle cx="60" cy="60" r="3"/><circle cx="140" cy="60" r="3"/><circle cx="220" cy="60" r="3"/>
    <circle cx="60" cy="140" r="3"/><circle cx="140" cy="140" r="3"/><circle cx="220" cy="140" r="3"/>
    <circle cx="60" cy="220" r="3"/><circle cx="140" cy="220" r="3"/><circle cx="220" cy="220" r="3"/>
    <circle cx="1000" cy="450" r="3"/><circle cx="1080" cy="450" r="3"/><circle cx="1160" cy="450" r="3"/>
    <circle cx="1000" cy="530" r="3"/><circle cx="1080" cy="530" r="3"/><circle cx="1160" cy="530" r="3"/>
    <circle cx="1000" cy="610" r="3"/><circle cx="1080" cy="610" r="3"/><circle cx="1160" cy="610" r="3"/>
  </g>

  <!-- Connecting lines from central globe to record cards -->
  <g stroke="#d9a679" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 520 200 C 470 160, 420 130, 360 110"/>
    <path d="M 520 250 C 460 250, 410 250, 360 250"/>
    <path d="M 520 320 C 460 330, 410 350, 360 380"/>
    <path d="M 560 380 C 600 430, 650 470, 700 500"/>
  </g>

  <!-- Central globe / phonebook node -->
  <circle cx="600" cy="290" r="120" fill="url(#nodeGrad)"/>
  <g stroke="#fff" stroke-width="3" fill="none" opacity="0.85">
    <ellipse cx="600" cy="290" rx="120" ry="48"/>
    <ellipse cx="600" cy="290" rx="62" ry="120"/>
    <line x1="480" y1="290" x2="720" y2="290"/>
  </g>
  <text x="600" y="300" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="700"
        font-family="Space Grotesk, -apple-system, BlinkMacSystemFont, sans-serif"
        letter-spacing="2">
    DNS
  </text>

  <!-- Record cards: each a small labeled tile, like index-card entries -->
  <g font-family="IBM Plex Mono, monospace" font-weight="700" font-size="22">
    <!-- A record -->
    <rect x="160" y="80"  width="200" height="64" rx="10" fill="#2b3a55"/>
    <text x="184" y="121" fill="#ffd166">A</text>
    <text x="232" y="121" fill="#cdd6e8" font-family="Nunito, sans-serif" font-weight="600" font-size="20">192.0.2.10</text>

    <!-- MX record -->
    <rect x="160" y="220" width="200" height="64" rx="10" fill="#2b3a55"/>
    <text x="184" y="261" fill="#7ddc8c">MX</text>
    <text x="248" y="261" fill="#cdd6e8" font-family="Nunito, sans-serif" font-weight="600" font-size="20">mail server</text>

    <!-- TXT record -->
    <rect x="160" y="360" width="200" height="64" rx="10" fill="#2b3a55"/>
    <text x="184" y="401" fill="#9ecbff">TXT</text>
    <text x="252" y="401" fill="#cdd6e8" font-family="Nunito, sans-serif" font-weight="600" font-size="20">SPF / DKIM</text>

    <!-- CAA record -->
    <rect x="700" y="450" width="200" height="64" rx="10" fill="#2b3a55"/>
    <text x="724" y="491" fill="#ff9f6b">CAA</text>
    <text x="800" y="491" fill="#cdd6e8" font-family="Nunito, sans-serif" font-weight="600" font-size="20">cert policy</text>
  </g>

  <!-- Floating extra record chips, scattered -->
  <g font-family="IBM Plex Mono, monospace" font-weight="700" font-size="18" fill="#8a6a45">
    <text x="880" y="140">AAAA</text>
    <text x="980" y="200">SRV</text>
    <text x="900" y="260">NS</text>
    <text x="120" y="500">CNAME</text>
    <text x="280" y="560">SOA</text>
    <text x="980" y="340">PTR</text>
  </g>

  <!-- Post ID badge -->
  <g>
    <rect x="40" y="540" width="160" height="50" rx="8" fill="#2b3a55" opacity="0.9"/>
    <text x="120" y="572" text-anchor="middle" fill="white" font-size="16" font-weight="600"
          font-family="IBM Plex Mono, monospace">
      POST-1053
    </text>
  </g>

  <!-- cloudmato.com watermark -->
  <text x="1160" y="610" text-anchor="end" fill="#a8896a" font-size="14"
        font-family="Nunito, sans-serif">
    cloudmato.com
  </text>
</svg>
