{{- /* Canonical URL: use the post's `canonical` param if set, else the permalink. */ -}}
<link rel="canonical" href="{{ with .Params.canonical }}{{ . | absURL }}{{ else }}{{ .Permalink }}{{ end }}" />

{{- /* JSON-LD: Article schema for posts, WebSite for the home page.
       safeJS is needed because <script> context double-escapes otherwise. */ -}}
{{ if and .IsPage (eq .Section "posts") }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": {{ .Title | jsonify | safeJS }},
  "description": {{ with .Description }}{{ . | jsonify | safeJS }}{{ else }}{{ .Summary | jsonify | safeJS }}{{ end }},
  "datePublished": {{ .Date.Format "2006-01-02T15:04:05Z07:00" | jsonify | safeJS }},
  "dateModified": {{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" | jsonify | safeJS }},
  "author": {
    "@type": "Person",
    "name": {{ with .Site.Params.author }}{{ . | jsonify | safeJS }}{{ else }}{{ .Site.Title | jsonify | safeJS }}{{ end }}
  },
  "publisher": {
    "@type": "Organization",
    "name": {{ .Site.Title | jsonify | safeJS }}
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": {{ .Permalink | jsonify | safeJS }}
  }{{ with .Params.keywords }},
  "keywords": {{ . | jsonify | safeJS }}{{ end }}
}
</script>
{{ else if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": {{ .Site.Title | jsonify | safeJS }},
  "url": {{ .Site.BaseURL | jsonify | safeJS }}{{ with .Site.Params.description }},
  "description": {{ . | jsonify | safeJS }}{{ end }}
}
</script>
{{ end }}
